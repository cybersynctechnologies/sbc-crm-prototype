<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const mm = [['Apr', 9.8], ['May', 11.2], ['Jun', 12.6], ['Jul', 14.1], ['Aug', 15.0], ['Sep', 15.5], ['Oct', 18.6]];
    const months = mm.map(([m, v], i) => ({ m, v: '$' + v + 'k', bar: 'width:60%;max-width:40px;border-radius:6px 6px 2px 2px;height:' + Math.round(v / 18.6 * 150) + 'px;background:' + (i === 6 ? '#2F4FD6' : '#BCC6F3') }));
    const camps = [
      ['C-1039', 'Android FTD', 'CPA', '$45.00', 5, '$15,570', '$3,944'],
      ['C-1040', 'Web registration', 'CPR', '$3.20', 3, '$2,240', '$590'],
      ['C-1033', 'Sports promo deposit', 'CPA', '$40.00', 2, '$780', '$196']
    ].map(([id, name, model, rate, pubs, rev, mar]) => ({ id, name, model, rate, pubs, rev, mar }));
    const chip = { Received: 'background:#E7ECFD;color:#2440B0', Settled: 'background:#E8F3EA;color:#1F6B37' };
    const hist = [
      ['Oct 2026', '2 Nov', '1,180', '1,012', '85.8%', 'Received'],
      ['Sep 2026', '6 Oct', '1,010', '880', '87.1%', 'Settled'],
