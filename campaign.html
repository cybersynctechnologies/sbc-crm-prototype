<section aria-label="October totals" style="background: #0C0E14; border-radius: 18px; padding: 24px 28px; color: #FFFFFF; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Publishers reported</span><span class="mono" style="font-size: 28px; font-weight: 500">412</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Advertiser validated</span><span class="mono" style="font-size: 28px; font-weight: 500">346</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Settled</span><span class="mono" style="font-size: 28px; font-weight: 500">346</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Validation rate</span><span class="mono" style="font-size: 28px; font-weight: 500">84.0%</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Revenue</span><span class="mono" style="font-size: 28px; font-weight: 500">$15,570</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Payout</span><span class="mono" style="font-size: 28px; font-weight: 500">$11,626</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Margin</span><span class="mono" style="font-size: 28px; font-weight: 500; color: #D4F25A">$3,944</span></div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 22px; align-items: start">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center">

<div style="display: flex; gap: 14px; font-size: 12px; color: #5C5F6A">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #F2B66A"></span>Reported</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #2F4FD6"></span>Validated</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px"><span style="font-weight: 500">{{g.name}}</span><span class="mono" style="{{g.accStyle}}">{{g.acc}}</span></div>
<div role="img" aria-label="{{g.label}}" style="position: relative; height: 12px; background: #F0F0EC; border-radius: 999px">
<div style="{{g.repStyle}}"></div>
<div style="{{g.confStyle}}"></div>
</div>
</div>
</sc-for>

<span aria-hidden="true" style="{{l.dot}}"></span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{l.text}}</span><span style="font-size: 12px; color: #5C5F6A">{{l.meta}}</span></div>
</div>
</sc-for>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Add a note<textarea rows="2" placeholder="e.g. Pulse asked for a recount on 12 leads" style="padding: 10px 12px; border: 1px solid #E2E2DC; border-radius: 10px; font: 14px Geist, system-ui, sans-serif; resize: vertical"></textarea></label>
</section>
</div>

<section aria-labelledby="pubs-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px">

<td class="num">{{r.usd}}</td>
<td class="num"><span style="{{r.mStyle}}">{{r.unit}}</span></td>
<td style="color: #4A4D57">{{r.terms}}</td>
<td><button type="button" aria-label="{{r.copyLabel}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border: 1px solid #E2E2DC; border-radius: 8px; background: #FAFAF8; font: 12px 'Geist Mono', ui-monospace, monospace; color: #4A4D57; cursor: pointer">{{r.link}}</button></td>
<td class="num">{{r.rep}}</td>
<td class="num">{{r.conf}}</td>
<td class="num"><span style="{{r.accStyle}}">{{r.acc}}</span></td>
<td class="num">{{r.pay}}</td>
<td class="num" style="font-weight: 600">{{r.mar}}</td>
</tr>
</sc-for>
</tbody>
<tfoot><tr><td>Total · {{pubCount}} publishers</td><td></td><td></td><td class="num">{{avgUnit}}</td><td></td><td></td><td class="num">{{tRep}}</td><td class="num">{{tConf}}</td><td class="num">{{tAcc}}</td><td class="num">{{tPay}}</td><td class="num">{{tMar}}</td></tr></tfoot>
</table>
</div>
<p style="margin: 0; padding: 14px 24px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A">Amounts in USD use the rates in Currencies &amp; geos. Changing a payout applies from today; past conversions keep the payout they were validated at.</p>
</section>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const RATE = { USD: 1, PHP: 0.01711, INR: 0.01188, IDR: 0.0000632, EUR: 1.084 }, EARN = 45;
    const base = [
      ['ClickHive Media', 'Priya S.', 34, 'USD', 'Net 15', 140, 131],
      ['AdNest Network', 'Arjun M.', 1987, 'PHP', 'Net 30', 102, 90],
      ['Orbit Leads', 'Karan D.', 33, 'USD', 'Weekly', 78, 62],
      ['Pulse Affiliates', 'Meera R.', 2694, 'INR', 'Net 30', 64, 38],
      ['BlueKite Ads', 'Priya S.', 34, 'USD', 'Net 15', 28, 25]
    ].concat(s.added || []);
    const pay = s.pay || {};
    const data = base.map((r) => [r[0], r[1], pay[r[0]] != null ? pay[r[0]] : r[2], r[3], r[4], r[5], r[6]]);
    const good = 'color:#14161C', low = 'color:#9A4A00;font-weight:600;background:#FFF1DF;padding:2px 8px;border-radius:6px';
    const usd = (n) => '$' + Math.round(n).toLocaleString('en-US');
    const usd2 = (n) => '$' + n.toFixed(2);
    const sym = { USD: '$', PHP: '₱', INR: '₹', IDR: 'Rp', EUR: '€' };
    let tRep = 0, tConf = 0, tPay = 0;
    const rows = data.map(([name, poc, amt, cur, terms, rep, conf], i) => {
      const acc = rep ? conf / rep * 100 : 0, u = amt * RATE[cur], unit = EARN - u;
      tRep += rep; tConf += conf; tPay += conf * u;
      return {
        name, poc, amt: amt.toLocaleString('en-US'), cur, terms, rep, conf, usd: usd2(u),
        unit: usd2(unit) + ' · ' + (unit / EARN * 100).toFixed(0) + '%', mStyle: unit < EARN * 0.15 ? low : good,
        setAmt: (e) => { const n = Number(String(e.target.value).replace(/,/g, '')); if (isFinite(n) && n >= 0) this.setState({ pay: Object.assign({}, pay, { [name]: n }) }); },
        link: 'trk.sbc/c1039-p' + (i + 1), copyLabel: 'Copy tracking link for ' + name,
        acc: rep ? acc.toFixed(1) + '%' : '—', accStyle: rep && acc < 70 ? low : good,
        pay: usd(conf * u), mar: usd(conf * unit)
      };
    });
    const tMar = tConf * EARN - tPay;
    const FREE = ['Nexa Ads', 'Lumen Traffic', 'Coral Media'].filter((n) => !base.some((r) => r[0] === n));
    const nPub = FREE.indexOf(s.nPub) >= 0 ? s.nPub : FREE[0], nCur = s.nCur || 'USD', nTerms = s.nTerms || 'Net 30';
    const nAmt = s.nAmt == null ? '32' : s.nAmt, nN = Number(String(nAmt).replace(/,/g, '')) || 0, nUnit = EARN - nN * RATE[nCur];
    const assignVals = {
      assignOpen: !!s.assign, assignExpanded: String(!!s.assign), toggleAssign: () => this.setState({ assign: !s.assign }),
      freePubs: FREE.map((v) => ({ v, sel: v === nPub })), setNPub: (e) => this.setState({ nPub: e.target.value }),
      nAmt, setNAmt: (e) => this.setState({ nAmt: e.target.value }),
      curOpts: Object.keys(RATE).map((id) => ({ id, sel: id === nCur })), setNCur: (e) => this.setState({ nCur: e.target.value }),
      termOpts: ['Weekly', 'Net 15', 'Net 30', 'Net 45'].map((v) => ({ v, sel: v === nTerms })), setNTerms: (e) => this.setState({ nTerms: e.target.value }),
      nMar: usd2(nUnit) + ' · ' + (nUnit / EARN * 100).toFixed(0) + '%',
      nBox: 'display:flex;flex-direction:column;gap:4px;min-height:44px;justify-content:center;padding:6px 12px;border-radius:10px;box-sizing:border-box;' + (nUnit < 0 ? 'background:#FDF3F1;border:1px solid #F5C9C3' : 'background:#F6F9E8;border:1px solid #D9EAA0'),
      assign: () => { if (!nPub || !nN) return; this.setState({ added: (s.added || []).concat([[nPub, 'Priya S.', nN, nCur, nTerms, 0, 0]]), assign: false, nAmt: '32' }); },
      pubCount: rows.length, tRep, tConf, tAcc: (tConf / tRep * 100).toFixed(1) + '%', tPay: usd(tPay), tMar: usd(tMar),
      avgUnit: usd2(tMar / tConf), avgMar: usd2(tMar / tConf) + ' / FTD · ' + (tMar / (tConf * EARN) * 100).toFixed(0) + '%'
    };
    const max = 140;
    const gaps = data.filter((r) => r[5]).map(([name, , , , , rep, conf]) => {
      const acc = conf / rep * 100;
      return {
        name, acc: acc.toFixed(1) + '%', accStyle: acc < 70 ? 'color:#9A4A00;font-weight:600' : 'color:#5C5F6A',
        label: name + ': ' + rep + ' reported, ' + conf + ' validated',
        repStyle: 'position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#F2B66A;width:' + (rep / max * 100).toFixed(1) + '%',
        confStyle: 'position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#2F4FD6;width:' + (conf / max * 100).toFixed(1) + '%'
      };
    });
    const dot = (c) => 'width:10px;height:10px;border-radius:50%;margin-top:5px;background:' + c;
    const log = [
      ['SpinArena October report uploaded · 346 FTD validated', '2 Nov · Arjun M.', '#2F4FD6'],
      ['Pulse Affiliates flagged: 59.4% validated, below the 70% threshold', '2 Nov · automatic', '#C66A00'],
      ['BlueKite Ads payout changed $32 → $34', '18 Oct · Arjun M.', '#8A8D97'],
      ['BlueKite Ads assigned to this campaign', '12 Oct · Arjun M.', '#8A8D97']
    ].map(([text, meta, c]) => ({ text, meta, dot: dot(c) }));
    return Object.assign({ rows, gaps, log }, assignVals);
  }
}
</script>
</body>
</html>
