<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Campaigns</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAF8}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="validation.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>Validation</a>
<a class="nav on" href="campaigns.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="categories.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="fields.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Fields &amp; formulas</a>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em">Campaigns</h1>
<p style="margin: 0; font-size: 14px; color: #5C5F6A">Every campaign we run, who runs it, and what it earns</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="btn" onClick="{{showRequests}}" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Log a request</button>
<a class="btn" href="campaign.html" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">+ New campaign</a>
</div>
</header>

<div role="tablist" aria-label="View" style="display: flex; gap: 4px; border-bottom: 1px solid #E2E2DC">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span class="mono" style="{{t.countStyle}}">{{t.count}}</span></button>
</sc-for>
</div>

<sc-if value="{{isCampaigns}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 10px; flex: 1 1 260px; box-sizing: border-box">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5F6A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search campaigns</span>
<input type="search" placeholder="Search by campaign, advertiser or ID" style="border: 0; outline: 0; flex: 1; font: 14px Geist, system-ui, sans-serif; background: transparent; color: #14161C; min-width: 0">
</label>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Status</span><select class="sel"><option>All statuses</option><option>Live</option><option>Paused</option><option>Ended</option></select></label>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Category</span><select class="sel"><option>All categories</option><option>iGaming</option><option>Banking</option><option>Credit card</option><option>Insurance</option><option>Lending</option><option>Gaming</option></select></label>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Geo</span><select class="sel"><option>All geos</option><option>India</option><option>Philippines</option><option>Indonesia</option><option>Vietnam</option></select></label>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Payout model</span><select class="sel"><option>All models</option><option>CPA</option><option>CPR</option><option>CPL</option><option>CPI</option></select></label>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">POC</span><select class="sel"><option>All POCs</option><option>Priya S.</option><option>Arjun M.</option><option>Karan D.</option><option>Meera R.</option></select></label>
</div>

<section aria-label="Campaign list" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Campaign</th><th scope="col">Advertiser</th><th scope="col">Category · geo</th><th scope="col">Model</th><th scope="col" style="text-align: right">Publishers</th><th scope="col">Status</th><th scope="col">POC</th><th scope="col" style="text-align: right">Oct revenue</th><th scope="col" style="text-align: right">Oct margin</th></tr></thead>
<tbody>
<sc-for list="{{campaigns}}" as="c" hint-placeholder-count="6">
<tr>
<td><a href="campaign.html" style="color: #14161C; font-weight: 500; text-decoration: none">{{c.name}}</a><div class="mono" style="font-size: 12px; color: #5C5F6A; margin-top: 2px">{{c.id}}</div></td>
<td><a href="advertiser.html" style="color: #14161C; text-decoration: none">{{c.adv}}</a><div style="font-size: 12px; color: #5C5F6A; margin-top: 2px">{{c.advType}}</div></td>
<td>{{c.cat}} <span style="color: #5C5F6A">· {{c.geo}}</span></td>
<td><span class="mono" style="font-size: 12px; padding: 3px 8px; border: 1px solid #E2E2DC; border-radius: 6px">{{c.model}}</span></td>
<td class="num">{{c.pubs}}</td>
<td><span class="chip" style="{{c.chipStyle}}"><span aria-hidden="true" style="{{c.dotStyle}}"></span>{{c.status}}</span></td>
<td>{{c.poc}}</td>
<td class="num">{{c.rev}}</td>
<td class="num" style="font-weight: 600">{{c.mar}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A">
<span>Showing 6 of 23 live and recent campaigns</span>
<span class="mono">Total Oct · revenue $48,920 · margin $12,780</span>
</div>
</section>
</div>
</sc-if>

<sc-if value="{{isRequests}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 18px; align-items: start">
<section aria-labelledby="new-req" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 id="new-req" style="margin: 0; font-size: 16px; font-weight: 600">Log a new request</h2>
<p style="margin: 0; font-size: 13px; color: #5C5F6A">Copy the details from the advertiser's email. Attach the email or brief so the team can check it later.</p>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Advertiser<select class="sel"><option>Nova Bank PH</option><option>SpinArena</option><option>Adbridge Agency</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Campaign name<input type="text" value="Credit card approval · CPA" class="sel"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Geo<select class="sel"><option>Philippines</option><option>India</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">KPI type<select class="sel"><option>Hard · paid on a real result</option><option>Soft · paid on activity</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Paid on<select class="sel"><option>Card approval</option><option>First deposit</option><option>Loan disbursal</option><option>Registration</option><option>Lead</option><option>Install</option><option>Click</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Model<select class="sel"><option>CPA</option><option>CPL</option><option>CPC</option><option>CPI</option><option>CPR</option><option>Rev share</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Advertiser pays (USD)<input type="text" value="18.00" class="sel mono"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">We offer publishers (USD)<input type="text" value="14.40" class="sel mono"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">Monthly cap<input type="text" value="1,500" class="sel mono"></label>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; background: #F6F9E8; border: 1px solid #D9EAA0; border-radius: 12px; font-size: 14px"><span>Our margin</span><span class="mono" style="font-weight: 600">$3.60 per approval · 20%</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px dashed #C9C9C2; border-radius: 12px; background: #FAFAF8">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C5F6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>
<span style="font-size: 13px; color: #5C5F6A; flex: 1">Attach email (.eml, .pdf) or brief</span>
<button type="button" class="btn" style="min-height: 44px; background: #FFFFFF; border: 1px solid #E2E2DC; color: #14161C">Browse</button>
</div>
<button type="button" class="btn" style="justify-content: center; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Save request</button>
</section>

<section aria-labelledby="inbox" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="inbox" style="margin: 0; font-size: 16px; font-weight: 600">Incoming requests</h2>
<span style="font-size: 13px; color: #5C5F6A">Newest first</span>
</div>
<sc-for list="{{requests}}" as="r" hint-placeholder-count="4">
<article style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 18px 24px; border-top: 1px solid #EFEFEB">
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 260px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span class="mono" style="font-size: 12px; color: #5C5F6A">{{r.id}}</span><span class="chip" style="{{r.chipStyle}}">{{r.status}}</span></div>
<span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 13px; color: #5C5F6A">{{r.adv}} · {{r.geo}} · <span class="mono">{{r.terms}}</span></span>
<span style="font-size: 12px; color: #5C5F6A">{{r.source}}</span>
</div>
<a class="btn" href="campaign.html" style="{{r.ctaStyle}}">{{r.cta}}</a>
</article>
</sc-for>
</section>
</div>
</sc-if>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const tab = (this.state && this.state.tab) || 'campaigns';
    const on = 'display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;background:transparent;border:0;border-bottom:2px solid #0C0E14;margin-bottom:-1px;font:600 14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const off = 'display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:500 14px Geist,system-ui,sans-serif;color:#5C5F6A;cursor:pointer';
    const cOn = 'font-size:12px;padding:1px 7px;border-radius:999px;background:#0C0E14;color:#FFFFFF';
    const cOff = 'font-size:12px;padding:1px 7px;border-radius:999px;background:#ECECE7;color:#4A4D57';
    const tabs = [['campaigns', 'Campaigns', '23'], ['requests', 'Requests', '3 new']].map(([id, label, count]) => ({
      label, count, selected: String(tab === id), style: tab === id ? on : off, countStyle: tab === id ? cOn : cOff,
      pick: () => this.setState({ tab: id })
    }));
    const st = {
      Live: ['background:#E7ECFD;color:#2440B0', '#2F4FD6'],
      Paused: ['background:#FFF1DF;color:#8A4300', '#C66A00'],
      Ended: ['background:#ECECE7;color:#4A4D57', '#8A8D97']
    };
    const campaigns = [
      ['C-1039', 'Android FTD', 'SpinArena', 'Direct brand', 'iGaming', 'PH', 'CPA', 5, 'Live', 'Arjun M.', '$15,570', '$3,944'],
      ['C-1042', 'Savings account', 'Nova Bank PH', 'Direct brand', 'Banking', 'PH', 'CPR', 4, 'Live', 'Priya S.', '$10,760', '$2,690'],
      ['C-1036', 'Kredo Card approval', 'Adbridge Agency', 'Agency · for Kredo Card', 'Credit card', 'IN', 'CPA', 3, 'Live', 'Karan D.', '$8,320', '$2,080'],
      ['C-1027', 'Install + registration', 'Pocket Rummy', 'Direct brand', 'Gaming', 'IN', 'CPR', 4, 'Live', 'Arjun M.', '$6,850', '$1,710'],
      ['C-1031', 'Health insurance lead', 'ShieldCare Insurance', 'Direct brand', 'Insurance', 'IN', 'CPL', 2, 'Paused', 'Meera R.', '$2,940', '$760'],
      ['C-1019', 'Personal loan disbursal', 'Lumi Lending', 'Network', 'Lending', 'ID', 'CPA', 2, 'Ended', 'Karan D.', '$1,460', '$410']
    ].map(([id, name, adv, advType, cat, geo, model, pubs, status, poc, rev, mar]) => ({
      id, name, adv, advType, cat, geo, model, pubs, status, poc, rev, mar,
      chipStyle: st[status][0], dotStyle: 'width:6px;height:6px;border-radius:50%;background:' + st[status][1]
    }));
    const rs = {
      New: 'background:#ECEBFA;color:#3A33A8',
      'Under review': 'background:#FFF1DF;color:#8A4300',
      Accepted: 'background:#E8F3EA;color:#1F6B37'
    };
    const primary = 'background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14';
    const secondary = 'background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC';
    const requests = [
