<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Categories</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.field{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;box-sizing:border-box;width:100%}
.lbl{font-size:13px;font-weight:600}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav on" href="categories.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em">Categories</h1>
<p style="margin: 0; font-size: 14px; color: #5C5F6A">Create and describe your own categories for campaigns, advertisers and publishers. Every list, filter, dashboard and report can then be split by them.</p>
</header>

<div role="tablist" aria-label="Category type" style="display: inline-flex; align-self: flex-start; flex-wrap: wrap; gap: 4px; padding: 4px; background: #E9E9E4; border-radius: 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span class="mono" style="font-size: 12px; color: #5C5F6A">{{t.count}}</span></button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="list-h" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 id="list-h" class="sr" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{typeLabel}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 12px">
<sc-for list="{{items}}" as="c" hint-placeholder-count="6">
<article style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="{{c.dot}}"></span>{{c.name}}</span>
<button type="button" aria-label="{{c.editLabel}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 8px; background: #FFFFFF; font: 500 13px Geist, system-ui, sans-serif; color: #14161C; cursor: pointer">Edit</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4A4D57">{{c.desc}}</p>
<span style="font-size: 12px; color: #5C5F6A">{{c.used}}</span>
</article>
</sc-for>
</div>
</section>

<aside aria-labelledby="new-h" style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<h2 id="new-h" style="margin: 0; font-size: 16px; font-weight: 600">New {{typeWord}} category</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Name</span><input class="field" type="text" value="{{newName}}" onChange="{{setName}}" placeholder="e.g. Crypto"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Description</span><textarea rows="3" onChange="{{setDesc}}" placeholder="What belongs in this category" style="padding: 10px 12px; border: 1px solid #E2E2DC; border-radius: 10px; font: 14px Geist, system-ui, sans-serif; resize: vertical">{{newDesc}}</textarea></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">Colour</span>
<div role="group" aria-label="Colour" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="6">
<button type="button" aria-label="{{w.label}}" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="{{w.style}}"></button>
</sc-for>
</div>
</div>
<button type="button" class="btn" onClick="{{add}}" style="justify-content: center; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Add category</button>
<p style="margin: 0; font-size: 12px; color: #5C5F6A">A campaign, advertiser or publisher can have more than one category. Only admins can add or edit categories.</p>
</aside>
</div>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const type = s.type || 'camp';
    const added = s.added || { camp: [], adv: [], pub: [] };
    const colors = [['Blue', '#2F4FD6'], ['Violet', '#5B4BD6'], ['Orange', '#C66A00'], ['Green', '#2E8A4E'], ['Red', '#B4232F'], ['Grey', '#6B6E76']];
    const C = {
      camp: ['Campaign categories', 'campaign', [
        ['iGaming', 'Betting, casino and sports offers, e.g. SpinArena', '#5B4BD6', '9 campaigns'],
        ['Banking', 'Bank account opening and savings, e.g. Nova Bank PH', '#2F4FD6', '6 campaigns'],
        ['Lending', 'Personal loans and credit lines, e.g. Lumi Lending', '#C66A00', '8 campaigns'],
        ['Credit card', 'Card approvals and activations, e.g. Kredo Card', '#B4232F', '3 campaigns'],
        ['Fintech & wallets', 'E-wallets and payment apps, e.g. Vela Pay', '#2E8A4E', '5 campaigns'],
        ['Insurance', 'Insurance leads and purchases, e.g. ShieldCare', '#6B6E76', '3 campaigns']
      ]],
      adv: ['Advertiser categories', 'advertiser', [
        ['Direct brand', 'The brand pays us directly', '#2F4FD6', '19 advertisers'],
        ['Agency', 'An agency buys on behalf of one or more brands', '#C66A00', '6 advertisers'],
        ['Ad network', 'Another network resells the offer to us', '#5B4BD6', '3 advertisers'],
        ['Key account', 'Top accounts by revenue that get priority reporting', '#2E8A4E', '4 advertisers']
      ]],
      pub: ['Publisher categories', 'publisher', [
        ['Network', 'Affiliate networks sending mixed traffic', '#2F4FD6', '18 publishers'],
        ['Media buyer', 'Buys paid traffic on social, search or display', '#C66A00', '11 publishers'],
        ['In-app', 'Traffic from inside mobile apps and SDKs', '#5B4BD6', '7 publishers'],
        ['Incentive traffic', 'Users rewarded for completing actions; watch accuracy', '#B4232F', '4 publishers'],
        ['Email & SMS', 'Owned lists sending email or SMS', '#6B6E76', '3 publishers']
      ]]
    };
    const tOn = 'display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px #0000001a;font:600 14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const tOff = 'display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;cursor:pointer';
    const tabs = Object.keys(C).map((id) => ({
      label: C[id][0], count: C[id][2].length + added[id].length, selected: String(id === type), style: id === type ? tOn : tOff,
      pick: () => this.setState({ type: id })
    }));
    const color = s.color || colors[0][1];
    const items = C[type][2].concat(added[type]).map(([name, desc, col, used]) => ({
      name, desc: desc || 'No description yet', used, editLabel: 'Edit ' + name,
      dot: 'width:12px;height:12px;border-radius:4px;background:' + col
    }));
    const swatches = colors.map(([label, hex]) => ({
      label, pressed: String(hex === color),
      style: 'width:36px;height:36px;border-radius:10px;cursor:pointer;background:' + hex + ';border:3px solid ' + (hex === color ? '#0C0E14' : '#FFFFFF') + ';box-shadow:0 0 0 1px #E2E2DC',
      pick: () => this.setState({ color: hex })
    }));
    return {
      tabs, items, swatches, typeLabel: C[type][0], typeWord: C[type][1],
      newName: s.newName || '', newDesc: s.newDesc || '',
      setName: (e) => this.setState({ newName: e.target.value }),
      setDesc: (e) => this.setState({ newDesc: e.target.value }),
      add: () => {
        const name = (s.newName || '').trim();
        if (!name) return;
        const next = Object.assign({}, added, { [type]: added[type].concat([[name, (s.newDesc || '').trim(), color, 'Not used yet']]) });
        this.setState({ added: next, newName: '', newDesc: '' });
      }
    };
  }
}
</script>
</body>
</html>
