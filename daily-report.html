<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Daily report</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:#FAFAF8;font-weight:600;border-top:1px solid #E6E6E1;border-bottom:0}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tab{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:9px;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;text-decoration:none}
.tab.on{background:#FFFFFF;box-shadow:0 1px 2px #0000001a;font-weight:600;color:#14161C}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav on" href="daily-entry.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="validation.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>Validation</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="categories.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="fields.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Fields &amp; formulas</a>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<nav aria-label="Daily entry views" style="display: inline-flex; align-self: flex-start; gap: 4px; padding: 4px; background: #E9E9E4; border-radius: 12px">
<a class="tab" href="daily-entry.html">Enter numbers</a>
<a class="tab on" href="daily-report.html" aria-current="page">Daily report</a>
</nav>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em">Daily report</h1>
<p style="margin: 0; font-size: 14px; color: #5C5F6A">Everything the team has entered this month, live as they type</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label><span class="sr">Month</span><select class="sel"><option>November 2026</option><option>October 2026</option><option>Custom range…</option></select></label>
<label><span class="sr">POC</span><select class="sel"><option>All POCs</option><option>My accounts</option></select></label>
<a class="btn" href="reports.html" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Export</a>
</div>
</header>

<section aria-label="This month so far" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5C5F6A">Conversions entered</span><span class="mono" style="font-size: 26px; font-weight: 500">{{mtd}}</span></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5C5F6A">Estimated revenue</span><span class="mono" style="font-size: 26px; font-weight: 500">{{rev}}</span></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #5C5F6A">Campaigns running</span><span class="mono" style="font-size: 26px; font-weight: 500">{{camps}}</span></div>
<div style="background: #FFF8EE; border: 1px solid #F3DDBE; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #8A4300">Publishers missing today</span><span class="mono" style="font-size: 26px; font-weight: 500; color: #8A4300">6 of 41</span></div>
</section>

<section aria-labelledby="rep-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px">
<h2 id="rep-h" style="margin: 0; font-size: 17px; font-weight: 600">By {{groupWord}} · November 2026</h2>
<div role="group" aria-label="Group by" style="display: inline-flex; gap: 4px; padding: 4px; background: #F0F0EC; border-radius: 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>
<div style="overflow-x: auto; border-top: 1px solid #EFEFEB">
<table>
<thead><tr><th scope="col">{{groupLabel}}</th><th scope="col">Category</th><th scope="col" style="text-align: right">Campaigns running</th><th scope="col" style="text-align: right">{{otherLabel}}</th><th scope="col">Day by day (1–30 Nov)</th><th scope="col" style="text-align: right">This month</th><th scope="col" style="text-align: right">Est. revenue</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<tr>
<td><a href="{{r.href}}" style="color: #14161C; font-weight: 500; text-decoration: none">{{r.name}}</a></td>
<td><span class="chip" style="{{r.catStyle}}">{{r.cat}}</span></td>
<td class="num">{{r.camps}}</td>
<td class="num">{{r.other}}</td>
<td><div role="img" aria-label="{{r.stripLabel}}" style="display: grid; grid-template-columns: repeat(30, 9px); gap: 2px"><sc-for list="{{r.strip}}" as="c" hint-placeholder-count="30"><span style="{{c}}"></span></sc-for></div></td>
<td class="num" style="font-weight: 600">{{r.mtd}}</td>
<td class="num">{{r.rev}}</td>
</tr>
</sc-for>
</tbody>
<tfoot><tr><td>Total</td><td></td><td class="num">{{camps}}</td><td></td><td></td><td class="num">{{mtd}}</td><td class="num">{{rev}}</td></tr></tfoot>
</table>
</div>
<div style="padding: 14px 20px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A">Darker squares mean more conversions that day. Revenue is estimated from entered conversions × each campaign's rate, until the advertiser's report is entered.</div>
</section>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const by = s.by || 'adv';
    const cats = {
      iGaming: 'background:#ECEBFA;color:#3A33A8', Banking: 'background:#E7ECFD;color:#2440B0', 'Credit card': 'background:#FFF1DF;color:#8A4300',
      Gaming: 'background:#E8F3EA;color:#1F6B37', Insurance: 'background:#ECECE7;color:#4A4D57',
      Network: 'background:#E7ECFD;color:#2440B0', 'Media buyer': 'background:#FFF1DF;color:#8A4300', 'Incentive traffic': 'background:#FBE7E9;color:#9B1C2C'
    };
    const D = {
      adv: ['Advertiser', 'Publishers', 'advertiser.html', [
        ['SpinArena', 'iGaming', 3, 5, [180, 195, 188, 174], 42.1],
        ['Nova Bank PH', 'Banking', 3, 6, [310, 342, 298, 320], 2.5],
        ['Pocket Rummy', 'Gaming', 1, 4, [402, 388, 415, 397], 1.0],
        ['Adbridge Agency', 'Credit card', 2, 3, [21, 19, 24, 18], 20],
        ['ShieldCare Insurance', 'Insurance', 1, 2, [12, 9, 0, 0], 5]
      ]],
      pub: ['Publisher', 'Advertisers', 'publisher.html', [
        ['ClickHive Media', 'Network', 6, 4, [117, 127, 121, 115], 6.6],
        ['AdNest Network', 'Network', 5, 3, [204, 219, 197, 210], 4.1],
        ['Orbit Leads', 'Media buyer', 4, 3, [156, 149, 162, 151], 3.8],
        ['Pulse Affiliates', 'Incentive traffic', 3, 2, [298, 311, 287, 0], 1.9],
        ['BlueKite Ads', 'Media buyer', 3, 3, [31, 30, 35, 0], 6.0]
      ]],
      cat: ['Category', 'Advertisers', 'categories.html', [
        ['iGaming', 'iGaming', 4, 2, [196, 210, 205, 190], 39.0],
        ['Banking', 'Banking', 4, 2, [318, 351, 305, 329], 2.6],
        ['Gaming', 'Gaming', 2, 1, [402, 388, 415, 397], 1.0],
        ['Credit card', 'Credit card', 3, 2, [21, 19, 24, 18], 20],
        ['Insurance', 'Insurance', 1, 1, [12, 9, 0, 0], 5]
      ]]
    };
    const [groupLabel, otherLabel, href, data] = D[by];
    const max = Math.max(...data.flatMap((r) => r[4]));
    const cell = (v, d) => {
      if (d > 4) return 'display:block;width:9px;height:18px;border-radius:2px;background:#F0F0EC';
      if (!v) return 'display:block;width:9px;height:18px;border-radius:2px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E2B979';
      const a = 0.25 + 0.75 * v / max;
      return 'display:block;width:9px;height:18px;border-radius:2px;background:rgba(47,79,214,' + a.toFixed(2) + ')';
    };
    let mtdAll = 0, revAll = 0, campsAll = 0;
    const rows = data.map(([name, cat, camps, other, days, rate]) => {
      const mtd = days.reduce((a, b) => a + b, 0), rev = mtd * rate;
      mtdAll += mtd; revAll += rev; campsAll += camps;
      return {
        name, cat, camps, other, href, catStyle: cats[cat] || 'background:#ECECE7;color:#4A4D57',
        strip: Array.from({ length: 30 }, (_, i) => cell(days[i], i + 1)),
        stripLabel: name + ': ' + days.join(', ') + ' conversions on 1–4 Nov',
        mtd: mtd.toLocaleString('en-US'), rev: '$' + Math.round(rev).toLocaleString('en-US')
      };
    });
    const on = 'min-height:40px;padding:0 14px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px #0000001a;font:600 13px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const off = 'min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;font:500 13px Geist,system-ui,sans-serif;color:#4A4D57;cursor:pointer';
    const groups = [['adv', 'Advertiser'], ['pub', 'Publisher'], ['cat', 'Category']].map(([id, label]) => ({
      label, pressed: String(id === by), style: id === by ? on : off, pick: () => this.setState({ by: id })
    }));
    return {
      groups, rows, groupLabel, otherLabel, groupWord: groupLabel.toLowerCase(),
      mtd: mtdAll.toLocaleString('en-US'), rev: '$' + Math.round(revAll).toLocaleString('en-US'), camps: campsAll
    };
  }
}
</script>
</body>
</html>
