<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:12px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:40px;padding:0 10px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.radio{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #E2E2DC;border-radius:12px;font-size:14px;cursor:pointer}

.seg{display:inline-flex;gap:4px;padding:4px;background:#ECECE7;border-radius:12px;flex-wrap:wrap}

.seg button[aria-pressed="true"]{background:#FFFFFF;color:#14161C;font-weight:600;box-shadow:0 1px 2px rgba(12,14,20,.08)}
.rowbtn{all:unset;cursor:pointer;font-weight:500;color:#14161C;display:inline-flex;align-items:center;gap:8px;min-height:32px}
.rowbtn:focus-visible{outline:2px solid #2F4FD6;outline-offset:2px;border-radius:4px}
tr.sel td{background:#F6F9E8}
.bar{position:relative;height:8px;width:120px;background:#F0F0EC;border-radius:999px;display:inline-block;vertical-align:middle}
.src{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #E6E6E1;border-radius:12px;background:#FAFAF8;flex:1 1 220px;min-width:0}
.src span:first-child{font-size:12px;color:#5C5F6A;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card{background:#FFFFFF;border:1px solid #E6E6E1;border-radius:16px}
.lbl{font-size:13px;font-weight:500}
.field{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;box-sizing:border-box;width:100%}
.tok{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid #D6DCF7;background:#F2F5FE;color:#2440B0;font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.tile{background:#FFFFFF;border:1px solid #E6E6E1;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
/* ui-kit: shared across every screen */
main{gap:24px!important}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.ph-t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px;max-width:760px}
.ph-t h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em}
.ph-t p{margin:0;font-size:14px;color:#5C5F6A;line-height:1.5}
.ph-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;align-self:flex-start;flex-wrap:wrap;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px;max-width:100%;box-sizing:border-box}
.tabs>button,.tabs>a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;text-decoration:none;cursor:pointer;white-space:nowrap}
.tabs>button:hover,.tabs>a:hover{color:#14161C}
.tabs>[aria-selected="true"],.tabs>[aria-pressed="true"],.tabs>[aria-current="page"]{background:#FFFFFF;color:#14161C;font-weight:600;box-shadow:0 1px 2px rgba(12,14,20,.08)}
.tabs .ct{font:500 11px 'Geist Mono',ui-monospace,monospace;color:#8A8D98}
.b1{background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14}
.b2{background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC}
.b2:hover{border-color:#C9C9C2}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2F4FD6;outline-offset:2px}
</style>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header class="ph">
<div class="ph-t"><h1>Fields &amp; formulas</h1>
<p>Shape the system around how your team works. Add your own fields to any record and write your own formulas. Both can be used in dashboards, reports, filters and Excel upload. Only admins can change this.</p>
</div>
</header>
<div class="tabs" role="tablist" aria-label="Section">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>

<sc-if value="{{isFields}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
<section aria-labelledby="flist" class="card" style="flex: 999 1 600px; min-width: 0; overflow: hidden">
<div style="padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
<h2 id="flist" style="margin: 0; font-size: 16px; font-weight: 600">Fields on {{objName}}</h2>
<div class="seg" role="group" aria-label="Record type"><sc-for list="{{objs}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
</div>
<div style="overflow-x: auto"><table>
<thead><tr><th scope="col">Field</th><th scope="col">Type</th><th scope="col">Required</th><th scope="col">Shown in tables</th><th scope="col">Source</th></tr></thead>
<tbody><sc-for list="{{fields}}" as="f" hint-placeholder-count="8"><tr><td style="font-weight: 500">{{f.name}}<div style="font-size: 12px; color: #5C5F6A; white-space: normal">{{f.hint}}</div></td><td><span class="chip" style="background: #ECECE7; color: #4A4D57">{{f.type}}</span></td><td>{{f.req}}</td><td>{{f.shown}}</td><td><span class="chip" style="{{f.srcStyle}}">{{f.src}}</span></td></tr></sc-for></tbody>
</table></div>
</section>
<section aria-labelledby="fadd" class="card" style="flex: 1 1 320px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 id="fadd" style="margin: 0; font-size: 16px; font-weight: 600">Add a field to {{objName}}</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Name</span><input class="field" type="text" value="{{fName}}" onChange="{{setFName}}" placeholder="e.g. Minimum deposit"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Type</span><select class="field" onChange="{{setFType}}"><sc-for list="{{types}}" as="t" hint-placeholder-count="9"><option selected="{{t.sel}}">{{t.v}}</option></sc-for></select></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Help text</span><input class="field" type="text" value="{{fHint}}" onChange="{{setFHint}}" placeholder="What the team should put here"></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: #0C0E14">Show as a column in tables and reports</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0C0E14">Required when adding a new record</label>
<button type="button" class="btn" onClick="{{addField}}" style="justify-content: center; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Add field</button>
<p style="margin: 0; font-size: 12px; color: #5C5F6A; line-height: 1.5">New fields appear straight away on forms, in Excel upload matching, in filters and in the formula builder. Built-in fields can be renamed or hidden but not deleted.</p>
</section>
</div>
</sc-if>

<sc-if value="{{isFormulas}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
<section aria-labelledby="mlist" class="card" style="flex: 999 1 600px; min-width: 0; overflow: hidden">
<div style="padding: 18px 24px"><h2 id="mlist" style="margin: 0; font-size: 16px; font-weight: 600">Formulas</h2><span style="font-size: 13px; color: #5C5F6A">Use them like any other number: in dashboard widgets, reports, tables and alerts</span></div>
<div style="overflow-x: auto"><table>
<thead><tr><th scope="col">Name</th><th scope="col">Formula</th><th scope="col">Shown as</th><th scope="col" style="text-align: right">SpinArena · Oct</th><th scope="col">Alert</th></tr></thead>
<tbody><sc-for list="{{metrics}}" as="m" hint-placeholder-count="6"><tr><td style="font-weight: 500">{{m.name}}<div style="font-size: 12px; color: #5C5F6A">{{m.by}}</div></td><td><span class="mono" style="font-size: 13px; color: #2440B0">{{m.f}}</span></td><td>{{m.fmt}}</td><td class="num" style="font-weight: 600">{{m.val}}</td><td style="font-size: 13px; color: #4A4D57">{{m.alert}}</td></tr></sc-for></tbody>
</table></div>
</section>
<section aria-labelledby="madd" class="card" style="flex: 1 1 360px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 id="madd" style="margin: 0; font-size: 16px; font-weight: 600">New formula</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Name</span><input class="field" type="text" value="{{mName}}" onChange="{{setMName}}"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Formula</span><input class="field mono" type="text" value="{{mF}}" onChange="{{setMF}}" aria-describedby="ftip"></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span id="ftip" style="font-size: 12px; color: #5C5F6A">Click a field to add it. Use + − × ÷ and brackets.</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{toks}}" as="t" hint-placeholder-count="10"><button type="button" class="tok" onClick="{{t.add}}">{{t.label}}</button></sc-for></div></div>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Show as</span><select class="field" onChange="{{setMFmt}}"><sc-for list="{{fmts}}" as="o" hint-placeholder-count="4"><option selected="{{o.sel}}">{{o.v}}</option></sc-for></select></label>
<div style="{{prevBox}}"><span style="font-size: 12px; color: #5C5F6A">Preview · SpinArena, Android FTD, October</span><span class="mono" style="font-size: 24px; font-weight: 600">{{preview}}</span></div>
<button type="button" class="btn" onClick="{{addMetric}}" style="justify-content: center; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Save formula</button>
</section>
</div>
</sc-if>

</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'fields', obj = s.obj || 'Campaigns';
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const tabs = [['fields', 'Custom fields'], ['formulas', 'Formulas'], ].map(([id, label]) => ({ label, sel: String(id === tab), pick: () => this.setState({ tab: id }) }));
    const B = ['Built in', 'background:#ECECE7;color:#4A4D57'], C = ['Custom', 'background:#EEF7CF;color:#3F5200'];
    const base = {
      Campaigns: [['Campaign name', 'Text', 'Yes', 'Yes', B, ''], ['Advertiser', 'Link to advertiser', 'Yes', 'Yes', B, ''], ['KPI type', 'Dropdown', 'Yes', 'Yes', B, 'Hard (deposit, loan, approval) or Soft (click, lead, install)'], ['Paid on', 'Dropdown', 'Yes', 'Yes', B, 'First deposit, Registration, Lead, Click, Install, Loan disbursal'], ['Advertiser pays', 'Money', 'Yes', 'Yes', B, 'Per conversion'], ['Default publisher payout', 'Money', 'Yes', 'Yes', B, ''], ['Minimum deposit', 'Money', 'No', 'Yes', C, 'Deposits below this are not counted'], ['Traffic allowed', 'Multi-select', 'No', 'No', C, 'Social, Push, Pop, Search, Email']],
      Advertisers: [['Name', 'Text', 'Yes', 'Yes', B, ''], ['Type', 'Dropdown', 'Yes', 'Yes', B, 'Direct brand, Agency, Network'], ['Report format', 'Link to format', 'No', 'No', B, ''], ['Validation day', 'Number', 'No', 'Yes', C, 'Day of the month their report usually arrives'], ['Payment terms', 'Dropdown', 'No', 'Yes', C, 'Net 15, Net 30, Net 45']],
      Publishers: [['Name', 'Text', 'Yes', 'Yes', B, ''], ['Account manager', 'Link to team member', 'Yes', 'Yes', B, ''], ['Payout currency', 'Dropdown', 'Yes', 'Yes', B, ''], ['Traffic type', 'Multi-select', 'No', 'Yes', C, ''], ['Telegram handle', 'Text', 'No', 'No', C, '']],
      'Daily rows': [['Date', 'Date', 'Yes', 'Yes', B, ''], ['Publisher', 'Link to publisher', 'Yes', 'Yes', B, ''], ['Campaign', 'Link to campaign', 'Yes', 'Yes', B, ''], ['Reported', 'Number', 'Yes', 'Yes', B, 'What the publisher says'], ['Validated', 'Number', 'No', 'Yes', B, 'Filled by the advertiser report'], ['Traffic source', 'Text', 'No', 'Yes', B, 'Sub ID'], ['First deposit amount', 'Money', 'No', 'Yes', C, 'From the advertiser file'], ['Player revenue', 'Money', 'No', 'No', C, 'From the advertiser file']]
    };
    const added = s.added || {};
    const fields = base[obj].concat(added[obj] || []).map(([name, type, req, shown, src, hint]) => ({ name, type, req, shown, hint, src: src[0], srcStyle: src[1] }));
    const objs = Object.keys(base).map(o => ({ label: o, pressed: String(o === obj), pick: () => this.setState({ obj: o }) }));
    const TYPES = ['Text', 'Number', 'Money', 'Percent', 'Date', 'Dropdown', 'Multi-select', 'Yes / No', 'Link to record', 'File'];
    const fType = s.fType || 'Money';
    // formulas
    const V = { Reported: 412, Validated: 346, 'Advertiser pays': 45, 'Publisher payout': 11626, Revenue: 15570, 'First deposit amount': 16989, 'Player revenue': 5210, 'Days live': 31 };
    const ev = (f) => { let x = f; Object.keys(V).sort((a, b) => b.length - a.length).forEach(k => { x = x.split('[' + k + ']').join('(' + V[k] + ')'); }); x = x.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'); if (!/^[\d\s.()+\-*/]+$/.test(x)) return null; try { const r = Function('return (' + x + ')')(); return isFinite(r) ? r : null; } catch (e) { return null; } };
    const fmtv = (v, f) => v == null ? 'Check the formula' : f === 'Percent' ? (v * 100).toFixed(1) + '%' : f === 'Money' ? '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : v.toLocaleString('en-US', { maximumFractionDigits: 2 });
    const baseM = [
      ['Validation rate', '[Validated] ÷ [Reported]', 'Percent', 'Built in', 'Under 70% → tell the account manager'],
      ['Margin', '[Revenue] − [Publisher payout]', 'Money', 'Built in', ''],
      ['Margin %', '([Revenue] − [Publisher payout]) ÷ [Revenue]', 'Percent', 'Built in', 'Under 15% → tell the owner'],
      ['Avg first deposit', '[First deposit amount] ÷ [Validated]', 'Money', 'Custom · Priya S.', 'Under $25 → flag publisher'],
      ['Player value per $1 paid', '[Player revenue] ÷ [Publisher payout]', 'Number', 'Custom · Arjun M.', '']
    ].concat(s.metrics || []);
    const metrics = baseM.map(([name, f, fmt, by, alert]) => ({ name, f, fmt, by, alert: alert || '—', val: fmtv(ev(f), fmt) }));
    const mF = s.mF == null ? '[Validated] ÷ [Days live]' : s.mF, mFmt = s.mFmt || 'Number', mName = s.mName == null ? 'Validated per day' : s.mName;
    const pv = ev(mF);
    const toks = Object.keys(V).map(k => ({ label: k, add: () => this.setState({ mF: (mF ? mF + ' ' : '') + '[' + k + ']' }) })).concat(['÷', '×', '+', '−'].map(op => ({ label: op, add: () => this.setState({ mF: mF + ' ' + op }) })));
    return {
      tabs, isFields: tab === 'fields', isFormulas: tab === 'formulas',
      objs, objName: obj, fields,
      types: TYPES.map(v => ({ v, sel: v === fType })), fName: s.fName || '', fHint: s.fHint || '',
      setFName: set('fName'), setFType: set('fType'), setFHint: set('fHint'),
      addField: () => { if (!s.fName) return; const a = Object.assign({}, added); a[obj] = (a[obj] || []).concat([[s.fName, fType, 'No', 'Yes', C, s.fHint || 'Added just now']]); this.setState({ added: a, fName: '', fHint: '' }); },
      metrics, mName, mF, toks, fmts: ['Number', 'Percent', 'Money'].map(v => ({ v, sel: v === mFmt })),
      setMName: set('mName'), setMF: set('mF'), setMFmt: set('mFmt'),
      preview: fmtv(pv, mFmt), prevBox: 'display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;' + (pv == null ? 'background:#FDF3F1;border:1px solid #F5C9C3' : 'background:#F6F9E8;border:1px solid #D9EAA0'),
      addMetric: () => { if (pv == null || !mName) return; this.setState({ metrics: (s.metrics || []).concat([[mName, mF, mFmt, 'Custom · Priya S.', '']]), mName: '', mF: '' }); },
    };
  }
}
