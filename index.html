<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Dashboard</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav on" href="index.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; color: #5C5F6A">Tuesday, 3 November 2026</p>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em">Good morning, Priya</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 10px; min-width: 280px; box-sizing: border-box">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5F6A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
<input type="search" placeholder="Search campaigns, publishers, advertisers" style="border: 0; outline: 0; flex: 1; font: 14px Geist, system-ui, sans-serif; background: transparent; color: #14161C; min-width: 0">
<span class="mono" style="font-size: 11px; color: #5C5F6A; border: 1px solid #E2E2DC; border-radius: 6px; padding: 2px 6px">⌘K</span>
</label>
<span class="chip" style="background: #ECEBFA; color: #3A33A8">Prototype · sample data</span>
</div>
</header>

<div style="position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{toggleDate}}" aria-expanded="{{dateExpanded}}" aria-haspopup="dialog" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #0C0E14; border-radius: 10px; background: #0C0E14; color: #FFFFFF; font: 600 14px Geist, system-ui, sans-serif; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<span>{{rangeLabel}}</span>
<span class="mono" style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #262A37; color: #D4F25A">by {{grain}}</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span style="font-size: 13px; color: #5C5F6A">compared with {{compareLabel}}</span>
<span style="flex: 1"></span>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">Advertiser
<select style="min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 10px; background: #FFFFFF; font: 14px Geist, system-ui, sans-serif; color: #14161C"><option>All advertisers</option><option>SpinArena</option><option>Nova Bank PH</option></select>
</label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">Category
<select style="min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 10px; background: #FFFFFF; font: 14px Geist, system-ui, sans-serif; color: #14161C"><option>All categories</option><option>iGaming</option><option>Banking</option><option>Credit card</option></select>
</label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">POC
<select style="min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 10px; background: #FFFFFF; font: 14px Geist, system-ui, sans-serif; color: #14161C"><option>Everyone</option><option>Me</option></select>
</label>
<sc-if value="{{dateOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Choose date range" style="position: absolute; top: 54px; left: 0; width: min(760px, 100%); background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 16px; box-shadow: 0 28px 56px -16px #0c0e1440, 0 2px 6px #0c0e1410; display: flex; flex-wrap: wrap; overflow: hidden">
<div style="flex: 1 1 220px; padding: 12px; border-right: 1px solid #EFEFEB; background: #FAFAF8; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #5C5F6A; padding: 8px 10px">Quick ranges</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="11">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}"><span>{{p.label}}</span><span class="mono" style="{{p.hintStyle}}">{{p.hint}}</span></button>
</sc-for>
</div>
<div style="flex: 999 1 400px; padding: 22px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Group numbers by</span>
<div role="group" aria-label="Group by" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: #F0F0EC; border-radius: 12px">
<sc-for list="{{grains}}" as="g" hint-placeholder-count="6">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">From<input type="date" value="{{from}}" onChange="{{setFrom}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 10px; font: 14px 'Geist Mono', ui-monospace, monospace; color: #14161C; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">To<input type="date" value="{{to}}" onChange="{{setTo}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #E2E2DC; border-radius: 10px; font: 14px 'Geist Mono', ui-monospace, monospace; color: #14161C; background: #FFFFFF"></label>
</div>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px"><input type="checkbox" checked="{{compare}}" onChange="{{toggleCompare}}" style="width: 18px; height: 18px; accent-color: #0C0E14">Compare with the previous period</label>
<p style="margin: 0; font-size: 12px; color: #5C5F6A">Financial year runs 1 April to 31 March. Every screen and export uses the range you pick here.</p>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" class="btn" onClick="{{toggleDate}}" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Cancel</button>
<button type="button" class="btn" onClick="{{toggleDate}}" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Apply range</button>
</div>
</div>
</div>
</sc-if>
</div>

<section aria-label="Money flow" style="background: #0C0E14; border-radius: 18px; padding: 28px; color: #FFFFFF; display: flex; flex-direction: column; gap: 24px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#ffffff0d 1px, transparent 1px); background-size: 18px 18px"></div>
<div style="position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #A6A9B6">Money flow · {{rangeLabel}}</span>
<span style="font-size: 15px; color: #D7D9E0">From advertisers, through publishers, to our margin</span>
</div>
<a href="settlements.html" style="color: #D4F25A; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; gap: 6px">Open settlements <span aria-hidden="true">→</span></a>
</div>
<div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A6A9B6">Revenue from advertisers</span><span class="mono" style="font-size: 40px; font-weight: 500; letter-spacing: -.03em">$48,920</span><span style="font-size: 13px; color: #A6A9B6"><span style="color: #D4F25A">▲ 7.3%</span> vs {{compareLabel}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A6A9B6">Paid to publishers</span><span class="mono" style="font-size: 40px; font-weight: 500; letter-spacing: -.03em">$36,140</span><span style="font-size: 13px; color: #A6A9B6">73.9% of revenue</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A6A9B6">Our margin</span><span class="mono" style="font-size: 40px; font-weight: 500; letter-spacing: -.03em; color: #D4F25A">$12,780</span><span style="font-size: 13px; color: #A6A9B6">26.1% · <span style="color: #D4F25A">▲ 0.4 pts</span></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #A6A9B6">Attribution accuracy</span><span class="mono" style="font-size: 40px; font-weight: 500; letter-spacing: -.03em">82.4%</span><span style="font-size: 13px; color: #A6A9B6">confirmed ÷ publisher reported</span></div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 10px">
<div role="img" aria-label="Revenue split: 73.9% publisher payout, 26.1% margin" style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 3px">
<div style="flex: 73.9; background: #4A5BE0"></div>
<div style="flex: 26.1; background: #D4F25A"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: #D7D9E0">
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #4A5BE0"></span>Publisher payout</span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #D4F25A"></span>Margin</span>
<span style="margin-left: auto; color: #A6A9B6">9,412 confirmed conversions · 23 live campaigns · 41 active publishers</span>
</div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 24px">
<section aria-labelledby="trend-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="trend-h" style="margin: 0; font-size: 16px; font-weight: 600">Revenue &amp; margin, last 6 months</h2>
<div style="display: flex; gap: 16px; font-size: 12px; color: #5C5F6A">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #2F4FD6"></span>Revenue</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #0C0E14"></span>Margin</span>
</div>
</div>
<div role="img" aria-label="Revenue grew from $31.2k in May to $48.9k in October; margin from $8.1k to $12.8k" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; align-items: end; height: 220px; border-bottom: 1px solid #E6E6E1; padding-bottom: 2px">
<sc-for list="{{months}}" as="mo" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end">
<span class="mono" style="font-size: 12px; color: #5C5F6A">{{mo.revL}}</span>
<div style="display: flex; gap: 4px; align-items: flex-end; width: 100%; justify-content: center">
<div style="{{mo.revStyle}}"></div>
<div style="{{mo.marStyle}}"></div>
</div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; font-size: 12px; color: #5C5F6A; text-align: center">
<sc-for list="{{months}}" as="mo" hint-placeholder-count="6"><span>{{mo.m}}</span></sc-for>
</div>
</section>

<section aria-labelledby="cat-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="cat-h" style="margin: 0; font-size: 16px; font-weight: 600">Revenue by category</h2>
<span style="font-size: 12px; color: #5C5F6A">October</span>
</div>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr) 72px 44px; gap: 12px; align-items: center; font-size: 14px">
<span>{{c.name}}</span>
<div style="height: 10px; background: #F0F0EC; border-radius: 999px; overflow: hidden"><div style="{{c.bar}}"></div></div>
<span class="mono" style="text-align: right">{{c.rev}}</span>
<span class="mono" style="text-align: right; color: #5C5F6A; font-size: 12px">{{c.pct}}</span>
</div>
</sc-for>
</section>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 24px">
<section aria-labelledby="pub-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px">
<h2 id="pub-h" style="margin: 0; font-size: 16px; font-weight: 600">Top publishers · October</h2>
<a href="publishers.html" style="font-size: 14px; font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">All publishers</a>
</div>
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Publisher</th><th scope="col" style="text-align: right">Confirmed</th><th scope="col" style="text-align: right">Accuracy</th><th scope="col" style="text-align: right">Revenue</th><th scope="col" style="text-align: right">Margin</th></tr></thead>
<tbody>
<sc-for list="{{pubs}}" as="r" hint-placeholder-count="5">
<tr>
<td><a href="publisher.html" style="color: #14161C; font-weight: 500; text-decoration: none">{{r.name}}</a><div style="font-size: 12px; color: #5C5F6A; margin-top: 2px">{{r.camps}} live campaigns</div></td>
<td class="num">{{r.conf}}</td>
<td class="num"><span style="{{r.accStyle}}">{{r.acc}}</span></td>
<td class="num">{{r.rev}}</td>
<td class="num" style="font-weight: 600">{{r.mar}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const P = [
      ['today', 'Today', '3 Nov', '2026-11-03', '2026-11-03', 'Day', '3 Nov 2026', '2 Nov'],
      ['yesterday', 'Yesterday', '2 Nov', '2026-11-02', '2026-11-02', 'Day', '2 Nov 2026', '1 Nov'],
      ['thisWeek', 'This week', 'Mon–Sun', '2026-11-02', '2026-11-08', 'Day', '2 – 8 Nov 2026', 'last week'],
      ['last7', 'Last 7 days', '7d', '2026-10-28', '2026-11-03', 'Day', '28 Oct – 3 Nov 2026', 'the 7 days before'],
      ['thisMonth', 'This month', 'Nov', '2026-11-01', '2026-11-30', 'Day', 'November 2026', 'October'],
      ['lastMonth', 'Last month', 'Oct', '2026-10-01', '2026-10-31', 'Week', 'October 2026', 'September'],
      ['thisQuarter', 'This quarter', 'Oct–Dec', '2026-10-01', '2026-12-31', 'Week', 'Oct – Dec 2026', 'Jul – Sep'],
      ['thisYear', 'This calendar year', '2026', '2026-01-01', '2026-12-31', 'Month', '2026', '2025'],
      ['fy', 'This financial year', 'FY 26–27', '2026-04-01', '2027-03-31', 'Month', 'FY 2026–27', 'FY 2025–26'],
      ['lastFy', 'Last financial year', 'FY 25–26', '2025-04-01', '2026-03-31', 'Month', 'FY 2025–26', 'FY 2024–25'],
      ['custom', 'Custom range', 'from – to', '2026-10-01', '2026-10-31', 'Day', '', 'the period before']
    ];
    const presetId = s.preset || 'lastMonth';
    const cur = P.find((p) => p[0] === presetId);
    const from = s.from || cur[3], to = s.to || cur[4];
    const grain = s.grain || cur[5];
    const compare = s.compare !== false;
    const fmt = (d) => { const [y, m, dd] = d.split('-'); return Number(dd) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(m) - 1] + ' ' + y; };
    const rangeLabel = presetId === 'custom' ? fmt(from) + ' – ' + fmt(to) : cur[6];
    const pOn = 'display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:#0C0E14;color:#FFFFFF;font:600 14px Geist,system-ui,sans-serif;cursor:pointer;text-align:left';
    const pOff = 'display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#14161C;font:500 14px Geist,system-ui,sans-serif;cursor:pointer;text-align:left';
    const presets = P.map(([id, label, hint]) => ({
      label, hint, pressed: String(id === presetId), style: id === presetId ? pOn : pOff,
      hintStyle: 'font-size:11px;color:' + (id === presetId ? '#D4F25A' : '#5C5F6A'),
      pick: () => this.setState({ preset: id, from: null, to: null, grain: null })
    }));
    const gOn = 'flex:1 1 auto;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px #0000001a;font:600 13px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const gOff = 'flex:1 1 auto;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;font:500 13px Geist,system-ui,sans-serif;color:#4A4D57;cursor:pointer';
    const grains = ['Day', 'Week', 'Month', 'Quarter', 'Year', 'FY'].map((g) => ({
      label: g === 'FY' ? 'Financial year' : g, pressed: String(g === grain), style: g === grain ? gOn : gOff,
      pick: () => this.setState({ grain: g })
    }));
    const dateVals = {
      presets, grains, from, to, grain: grain === 'FY' ? 'FY' : grain.toLowerCase(), rangeLabel, compare,
      compareLabel: compare ? cur[7] : 'nothing',
      dateOpen: !!s.open, dateExpanded: String(!!s.open),
      toggleDate: () => this.setState({ open: !s.open }),
      setFrom: (e) => this.setState({ from: e.target.value, to: to, preset: 'custom' }),
      setTo: (e) => this.setState({ to: e.target.value, from: from, preset: 'custom' }),
      toggleCompare: () => this.setState({ compare: !compare })
    };
    const m = [['May', 31.2, 8.1], ['Jun', 35.8, 9.0], ['Jul', 39.4, 10.2], ['Aug', 42.1, 11.0], ['Sep', 45.6, 11.9], ['Oct', 48.9, 12.8]];
    const months = m.map(([mm, r, g], i) => ({
      m: mm, revL: '$' + r + 'k',
      revStyle: 'width:38%;max-width:30px;border-radius:6px 6px 2px 2px;height:' + Math.round(r / 48.9 * 170) + 'px;background:' + (i === 5 ? '#2F4FD6' : '#BCC6F3'),
      marStyle: 'width:38%;max-width:30px;border-radius:6px 6px 2px 2px;height:' + Math.round(g / 48.9 * 170) + 'px;background:' + (i === 5 ? '#0C0E14' : '#9A9CA6')
    }));
    const cats = [['iGaming', 18590, 38], ['Banking', 10760, 22], ['Credit card', 8320, 17], ['Gaming', 6850, 14], ['Insurance', 2940, 6], ['Lending', 1460, 3]].map(([name, rev, pct]) => ({
      name, rev: '$' + rev.toLocaleString('en-US'), pct: pct + '%',
      bar: 'height:100%;border-radius:999px;background:#2F4FD6;width:' + Math.round(pct / 38 * 100) + '%'
    }));
    const good = 'color:#14161C', low = 'color:#9A4A00;font-weight:600;background:#FFF1DF;padding:2px 8px;border-radius:6px';
    const pubs = [
      ['ClickHive Media', 6, '2,840', 91.2, '$14,210', '$3,980'],
      ['AdNest Network', 5, '2,115', 86.7, '$11,060', '$2,870'],
      ['Orbit Leads', 4, '1,690', 78.4, '$8,450', '$2,110'],
      ['BlueKite Ads', 3, '980', 88.1, '$4,900', '$1,270'],
      ['Pulse Affiliates', 3, '1,240', 64.9, '$6,200', '$1,490']
    ].map(([name, camps, conf, acc, rev, mar]) => ({ name, camps, conf, acc: acc + '%', accStyle: acc < 70 ? low : good, rev, mar }));
    const chips = {
      Pending: 'background:#FFF1DF;color:#8A4300',
      Received: 'background:#E7ECFD;color:#2440B0',
      Disputed: 'background:#FBE7E9;color:#9B1C2C',
      Settled: 'background:#E8F3EA;color:#1F6B37'
    };
    const reports = [
      ['Nova Bank PH', 'Savings Account · CPR', 'Oct 2026', 'Pending'],
      ['SpinArena', 'Android FTD · CPA', 'Oct 2026', 'Received'],
      ['Adbridge Agency', 'Kredo Card approval · CPA', 'Oct 2026', 'Disputed'],
      ['Pocket Rummy', 'Install + registration · CPR', 'Oct 2026', 'Pending'],
      ['ShieldCare Insurance', 'Health lead · CPL', 'Sep 2026', 'Settled']
    ].map(([adv, camp, period, status]) => ({ adv, camp, period, status, chipStyle: chips[status] }));
    return Object.assign({ months, cats, pubs, reports }, dateVals);
  }
}
</script>
