<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Dashboard</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.field{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;box-sizing:border-box;width:100%}
.lbl{font-size:13px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dgrid{position:relative}
.wg{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;overflow:hidden;transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
.wg.ed{outline:1px dashed #B9BBC6;outline-offset:-1px}
.wg.on{outline:2px solid #2F4FD6;outline-offset:-2px}
.wh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:40px}
.wt{display:flex;flex-direction:column;gap:2px;min-width:0}
.wt h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt span{font-size:12px;color:#5C5F6A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .wt span{color:#A6A9B6}
.wtool{display:flex;gap:4px;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid #E2E2DC;border-radius:9px;background:#FFFFFF;color:#14161C;cursor:pointer;padding:0}
.ib:hover{background:#F4F4F1}
.ib[data-move]{cursor:grab;touch-action:none}
.dark .ib{background:#1C1F28;border-color:#2C3142;color:#FFFFFF}
.rz{position:absolute;right:4px;bottom:4px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;border-radius:6px;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px;box-sizing:border-box}
.rz::after{content:"";width:10px;height:10px;border-right:2px solid #8A8D98;border-bottom:2px solid #8A8D98;border-radius:0 0 3px 0}
.wg table td,.wg table th{padding:10px 14px}
.typ{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border:1px solid #E2E2DC;border-radius:12px;background:#FFFFFF;font:500 13px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer;text-align:left}
.typ[aria-pressed="true"]{border-color:#0C0E14;box-shadow:inset 0 0 0 1px #0C0E14;font-weight:600}
.tok{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid #D6DCF7;background:#F2F5FE;color:#2440B0;font:500 13px Geist,system-ui,sans-serif;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:#0C0E14;margin:0}
.pop{position:absolute;top:52px;z-index:40;background:#FFFFFF;border:1px solid #E2E2DC;border-radius:16px;box-shadow:0 28px 56px -16px #0c0e1440,0 2px 6px #0c0e1410;padding:20px;display:flex;flex-direction:column;gap:14px;width:min(380px,100%);box-sizing:border-box}
@media (max-width:900px){.dgrid{height:auto!important;display:flex;flex-direction:column;gap:16px}.wg{position:relative!important;left:auto!important;top:auto!important;width:auto!important}.gcol{display:none}}
/* ui-kit: shared across every screen */
main{gap:24px!important}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.ph-t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px;max-width:760px}
.ph-t h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em}
.ph-t p{margin:0;font-size:14px;color:#5C5F6A;line-height:1.5}
.ph-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;align-self:flex-start;flex-wrap:wrap;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px;max-width:100%;box-sizing:border-box}
.tabs>button,.tabs>a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;text-decoration:none;cursor:pointer;white-space:nowrap}
.tabs>button:hover,.tabs>a:hover{color:#14161C}
.tabs>[aria-selected="true"],.tabs>[aria-pressed="true"],.tabs>[aria-current="page"]{background:#FFFFFF;color:#14161C;font-weight:600;box-shadow:0 1px 2px rgba(12,14,20,.08)}
.tabs .ct{font:500 11px 'Geist Mono',ui-monospace,monospace;color:#8A8D98}
.b1{background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14}
.b2{background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC}
.b2:hover{border-color:#C9C9C2}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2F4FD6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav on" href="index.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="validation.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>Validation</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="categories.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="fields.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Fields &amp; formulas</a>
<a class="nav" href="currencies.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg>Currencies &amp; geos</a>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header class="ph">
<div class="ph-t">
<h1>Dashboard</h1>
<p>Good morning, Priya · Tuesday, 3 November 2026. Make as many dashboards as you need, each with the numbers and formulas you choose.</p>
</div>
<div class="ph-a">
<sc-if value="{{notEditing}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn b2" onClick="{{startEdit}}">Edit layout</button>
<button type="button" class="btn b1" onClick="{{addWidget}}">+ Add widget</button>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<button type="button" class="btn b2" onClick="{{cancelEdit}}">Cancel</button>
<button type="button" class="btn b2" onClick="{{addWidget}}">+ Add widget</button>
<button type="button" class="btn b1" onClick="{{saveEdit}}">Save layout</button>
</sc-if>
</div>
</header>

<div style="position: relative; z-index: 7; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div class="tabs" role="tablist" aria-label="Dashboards">
<sc-for list="{{dashTabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.name}}<span class="ct">{{t.count}}</span></button></sc-for>
<button type="button" onClick="{{toggleNew}}" aria-expanded="{{newExpanded}}" style="color: #2F4FD6; font-weight: 600">+ New dashboard</button>
</div>
<span style="font-size: 13px; color: #5C5F6A">Visible to {{who}}</span>
<button type="button" class="btn b2" onClick="{{toggleSet}}" aria-expanded="{{setExpanded}}" style="min-height: 40px">Dashboard settings</button>

<sc-if value="{{newOpen}}" hint-placeholder-val="{{ false }}">
<div class="pop" role="dialog" aria-label="New dashboard" style="left: 0">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">New dashboard</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Name</span><input class="field" type="text" value="{{newName}}" onChange="{{setNewName}}" placeholder="e.g. Finance · month end"></label>
<div role="radiogroup" aria-label="Start from" style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Start from</span>
<sc-for list="{{starts}}" as="o" hint-placeholder-count="3"><label class="chk"><input type="radio" name="start" checked="{{o.sel}}" onChange="{{o.pick}}">{{o.label}}</label></sc-for>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px"><button type="button" class="btn b2" onClick="{{toggleNew}}">Cancel</button><button type="button" class="btn b1" onClick="{{createDash}}">Create dashboard</button></div>
</div>
</sc-if>

<sc-if value="{{setOpen}}" hint-placeholder-val="{{ false }}">
<div class="pop" role="dialog" aria-label="Dashboard settings" style="right: 0">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Dashboard settings</h2>
<label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Name</span><input class="field" type="text" value="{{curName}}" onChange="{{rename}}"></label>
<div style="display: flex; flex-direction: column; gap: 2px"><span class="lbl" style="margin-bottom: 4px">Who can see it</span>
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4"><label class="chk"><input type="checkbox" checked="{{r.on}}" onChange="{{r.toggle}}">{{r.label}}</label></sc-for>
</div>
<label class="chk"><input type="checkbox" checked="{{isDefault}}" onChange="{{makeDefault}}">Open this dashboard first</label>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<button type="button" class="btn b2" onClick="{{deleteDash}}" style="color: #9B1C2C">Delete</button>
<span style="display: flex; gap: 10px"><button type="button" class="btn b2" onClick="{{duplicate}}">Duplicate</button><button type="button" class="btn b1" onClick="{{toggleSet}}">Done</button></span>
</div>
</div>
</sc-if>
</div>

<div style="position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{toggleDate}}" aria-expanded="{{dateExpanded}}" aria-haspopup="dialog" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #0C0E14; border-radius: 10px; background: #0C0E14; color: #FFFFFF; font: 600 14px Geist, system-ui, sans-serif; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<span>{{rangeLabel}}</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span style="font-size: 13px; color: #5C5F6A">compared with {{compareLabel}}</span>
<a href="currencies.html" class="chip" style="background: #E8F3EA; color: #1F6B37; text-decoration: none" title="Change the display currency">All amounts in USD</a>
<span style="flex: 1"></span>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">Advertiser
<select class="sel" onChange="{{setFAdv}}"><sc-for list="{{fAdvs}}" as="o" hint-placeholder-count="6"><option selected="{{o.sel}}">{{o.v}}</option></sc-for></select>
</label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">Category
<select class="sel" onChange="{{setFCat}}"><sc-for list="{{fCats}}" as="o" hint-placeholder-count="6"><option selected="{{o.sel}}">{{o.v}}</option></sc-for></select>
</label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5C5F6A">POC
<select class="sel" onChange="{{setFPoc}}"><sc-for list="{{fPocs}}" as="o" hint-placeholder-count="5"><option selected="{{o.sel}}">{{o.v}}</option></sc-for></select>
</label>
<sc-if value="{{dateOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Choose date range" style="position: absolute; top: 54px; left: 0; width: min(640px, 100%); background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 16px; box-shadow: 0 28px 56px -16px #0c0e1440, 0 2px 6px #0c0e1410; display: flex; flex-wrap: wrap; overflow: hidden">
<div style="flex: 1 1 220px; padding: 12px; border-right: 1px solid #EFEFEB; background: #FAFAF8; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #5C5F6A; padding: 8px 10px">Quick ranges</span>
<sc-for list="{{presets}}" as="p" hint-placeholder-count="11">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}"><span>{{p.label}}</span><span class="mono" style="{{p.hintStyle}}">{{p.hint}}</span></button>
</sc-for>
</div>
<div style="flex: 999 1 300px; padding: 22px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">From<input type="date" value="{{from}}" onChange="{{setFrom}}" class="field mono"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">To<input type="date" value="{{to}}" onChange="{{setTo}}" class="field mono"></label>
</div>
<label class="chk"><input type="checkbox" checked="{{compare}}" onChange="{{toggleCompare}}">Compare with the previous period</label>
<p style="margin: 0; font-size: 12px; color: #5C5F6A; line-height: 1.5">Widgets set to “Dashboard dates” follow this range. Others keep their own. Financial year runs 1 April to 31 March.</p>
<div style="display: flex; justify-content: flex-end; gap: 10px">
<button type="button" class="btn b2" onClick="{{toggleDate}}">Cancel</button>
<button type="button" class="btn b1" onClick="{{toggleDate}}">Apply range</button>
</div>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 12px; background: #EEF2FE; border: 1px solid #D6DCF7; font-size: 14px; color: #1E2A6B">
<strong style="font-weight: 600">Editing {{curName}}</strong>

</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  componentDidMount() {
    const GAP = 16, ROW = 80, U = ROW + GAP;
    const stop = () => { ['pointermove', 'pointerup', 'pointercancel'].forEach((t) => document.removeEventListener(t, t === 'pointermove' ? this._move : this._up)); };
    this._target = (d) => {
      const w = ((this.state || {}).draft || []).find((x) => x.id === d.id);
      if (!w) return null;
      if (d.resize) return { x: w.x, y: w.y, w: Math.max(2, Math.min(12 - w.x, Math.round((d.w0 + d.dx + GAP) / d.colW))), h: Math.max(2, Math.round((d.h0 + d.dy + GAP) / U)) };
      return { x: Math.max(0, Math.min(12 - w.w, Math.round(w.x + d.dx / d.colW))), y: Math.max(0, Math.round(w.y + d.dy / U)), w: w.w, h: w.h };
    };
    this._down = (e) => {
      const h = e.target && e.target.closest ? e.target.closest('[data-move],[data-resize]') : null;
      if (!h || !(this.state || {}).editing) return;
      const card = h.closest('[data-wid]'), grid = card && card.closest('[data-grid]');
      if (!card || !grid) return;
      e.preventDefault();
      const gr = grid.getBoundingClientRect(), cr = card.getBoundingClientRect();
      this._d = { id: card.getAttribute('data-wid'), resize: h.hasAttribute('data-resize'), sx: e.clientX, sy: e.clientY, card, grid, colW: (gr.width + GAP) / 12, w0: cr.width, h0: cr.height, dx: 0, dy: 0 };
      const c = card.style; c.zIndex = '30'; c.transition = 'none'; c.boxShadow = '0 24px 48px -12px rgba(12,14,20,.3)';
      document.addEventListener('pointermove', this._move);
      document.addEventListener('pointerup', this._up);
      document.addEventListener('pointercancel', this._up);
    };
    this._move = (e) => {
      const d = this._d; if (!d) return;
      d.dx = e.clientX - d.sx; d.dy = e.clientY - d.sy;
      if (d.resize) { d.card.style.setProperty('--dw', d.dx + 'px'); d.card.style.setProperty('--dh', d.dy + 'px'); }
      else d.card.style.transform = 'translate(' + d.dx + 'px,' + d.dy + 'px)';
      const t = this._target(d); if (!t) return;
      const g = d.grid.style;
      g.setProperty('--gd', 'block');
      g.setProperty('--gl', 'calc((100% + 16px) * ' + t.x + ' / 12)');
      g.setProperty('--gt', t.y * U + 'px');
      g.setProperty('--gw', 'calc((100% + 16px) * ' + t.w + ' / 12 - 16px)');
      g.setProperty('--gh', (t.h * U - GAP) + 'px');
    };
    this._up = () => {
      const d = this._d; if (!d) return;
      this._d = null; stop();
      const c = d.card.style;
      c.transform = ''; c.zIndex = ''; c.boxShadow = ''; c.transition = ''; c.removeProperty('--dw'); c.removeProperty('--dh');
      ['--gd', '--gl', '--gt', '--gw', '--gh'].forEach((p) => d.grid.style.removeProperty(p));
      if (Math.abs(d.dx) < 4 && Math.abs(d.dy) < 4) return;
      const t = this._target(d); if (!t) return;
      const draft = this.state.draft.map((w) => (w.id === d.id ? Object.assign({}, w, t) : w));
      this.setState({ draft: Component.compact(draft, d.id) });
    };
    document.addEventListener('pointerdown', this._down);
  }

  componentWillUnmount() { document.removeEventListener('pointerdown', this._down); }

  static compact(list, id) {
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    const place = (items, first) => {
      const out = [];
      items.forEach((w) => { const n = Object.assign({}, w); if (!first || n.id !== id) n.y = 0; while (out.some((p) => hit(p, n))) n.y++; out.push(n); });
      return out;
    };
    const byYX = (a, b) => a.y - b.y || (a.id === id ? -1 : b.id === id ? 1 : a.x - b.x);
    const mv = list.find((w) => w.id === id);
    const pass1 = place((mv ? [mv] : []).concat(list.filter((w) => w.id !== id).sort(byYX)), true);
    return place(pass1.sort(byYX), false);
  }

  renderVals() {
    const s = this.state || {};
    const set = (k) => (e) => this.setState({ [k]: e.target.value });

    // ---------- sample data (fictional) ----------
    const PUBS = [['ClickHive Media', 1.3, 0.93], ['AdNest Network', 1.05, 0.88], ['Orbit Leads', 0.85, 0.8], ['Pulse Affiliates', 0.75, 0.6], ['BlueKite Ads', 0.45, 0.89]];
    const ADVS = [['SpinArena', 'iGaming', 'Arjun M.', 45, 0.74, 48, 1.0], ['Nova Bank PH', 'Banking', 'Priya S.', 18, 0.75, 0, 1.5], ['Adbridge Agency', 'Credit card', 'Karan D.', 32, 0.75, 0, 0.6], ['Pocket Rummy', 'Gaming', 'Arjun M.', 9, 0.73, 22, 1.7], ['ShieldCare Insurance', 'Insurance', 'Meera R.', 14, 0.74, 0, 0.5]];
    const MON = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'], MONL = ['May', 'June', 'July', 'August', 'September', 'October', 'November'];
    const GROW = [0.64, 0.73, 0.81, 0.86, 0.93, 1, 0.105];
    const raw = [];
    PUBS.forEach(([pub, pv, pvr], pi) => ADVS.forEach(([adv, cat, poc, pays, ratio, dep, av], ak) => GROW.forEach((g, m) => {
      const j = 0.88 + 0.24 * (((pi * 7 + ak * 13 + m * 5) % 10) / 10);
      const vr = Math.min(0.97, pvr * (0.96 + 0.04 * ((ak + m) % 3)));
      raw.push({ pub, adv, cat, poc, m, base: pv * av * g * j, vr, pays, ratio, dep });
    })));
    const octRaw = raw.filter((r) => r.m === 5).reduce((a, r) => a + r.base * r.vr * r.pays, 0);
    const K = 48920 / octRaw;
    const ROWS = raw.map((r) => { const rep = r.base * K, val = rep * r.vr, rev = val * r.pays; return { pub: r.pub, adv: r.adv, cat: r.cat, poc: r.poc, m: r.m, Reported: rep, Validated: val, Revenue: rev, 'Publisher payout': rev * r.ratio, 'First deposit amount': val * r.dep }; });
    const FIELDS = ['Reported', 'Validated', 'Revenue', 'Publisher payout', 'First deposit amount'];
    const DAYW = Array.from({ length: 31 }, (_, i) => { const d = i + 1, wd = (d + 3) % 7; return 1 + 0.16 * Math.sin(d / 2.2) + (wd === 5 || wd === 6 ? -0.14 : 0.04); });
    const DAYS = DAYW.reduce((a, b) => a + b, 0);

    // ---------- formulas ----------
    const M = [
      ['rev', 'Revenue', '[Revenue]', 'money'], ['pay', 'Publisher payout', '[Publisher payout]', 'money'],
      ['margin', 'Margin', '[Revenue] − [Publisher payout]', 'money'], ['mpct', 'Margin %', '([Revenue] − [Publisher payout]) ÷ [Revenue]', 'pct'],
