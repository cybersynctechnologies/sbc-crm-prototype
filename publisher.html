<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 140px; border-top: 1.5px dashed #C66A00"></div>

<td><a href="advertiser.html" style="color: #14161C; text-decoration: none">{{c.adv}}</a></td>

<td class="num">{{c.rep}}</td>
<td class="num">{{c.conf}}</td>
<td class="num">{{c.acc}}</td>

</table>
</div>
</section>

<section aria-labelledby="pays" class="card" style="overflow: hidden">

</sc-for>
</tbody>
</table>

<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const acc = [['May', 88.0], ['Jun', 90.1], ['Jul', 87.4], ['Aug', 92.0], ['Sep', 93.1], ['Oct', 91.2]].map(([m, v], i) => ({
      m, v: v.toFixed(1) + '%',
      bar: 'width:60%;max-width:40px;border-radius:6px 6px 2px 2px;height:' + Math.round(v * 2) + 'px;background:' + (i === 5 ? '#2F4FD6' : '#BCC6F3')
    }));
    const camps = [
      ['Android FTD', 'SpinArena', '$34.00', '140', '131', '93.6%', '$4,454'],
      ['Savings account', 'Nova Bank PH', '$2.10', '1,380', '1,260', '91.3%', '$2,646'],
      ['Kredo Card approval', 'Adbridge Agency', '$20.00', '86', '79', '91.9%', '$1,580'],
      ['Install + registration', 'Pocket Rummy', '$0.50', '1,900', '1,720', '90.5%', '$860'],
      ['Web registration', 'SpinArena', '$2.30', '330', '300', '90.9%', '$690'],
      ['Credit card approval · starts 4 Nov', 'Nova Bank PH', '$13.00', '—', '—', '—', '—']
    ].map(([name, adv, rate, rep, conf, a, pay]) => ({ name, adv, rate, rep, conf, acc: a, pay }));
    const chip = { 'Waiting on advertisers': 'background:#FFF1DF;color:#8A4300', Paid: 'background:#E8F3EA;color:#1F6B37' };
    const pays = [
      ['October 2026', '$10,230', 'Waiting on advertisers', '2 of 4 advertiser reports in'],
      ['September 2026', '$9,870', 'Paid', 'Paid 21 Oct'],
      ['August 2026', '$9,140', 'Paid', 'Paid 19 Sep']
    ].map(([m, amt, status, note]) => ({ m, amt, status, note, chip: chip[status] }));
    return { acc, camps, pays };
  }
}
</script>
