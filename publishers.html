<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Publishers</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAF8}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav on" href="publishers.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.025em">Publishers</h1>
<p style="margin: 0; font-size: 14px; color: #5C5F6A">Who runs our campaigns and gets paid by us</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a class="btn" href="broadcast.html" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Message publishers</a>
<a class="btn" href="upload.html" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Import from Excel</a>
<a class="btn" href="publisher.html" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">+ Add publisher</a>
</div>
</header>

<section aria-label="Publisher summary, October 2026" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5C5F6A">Paid to publishers · Oct</span><span class="mono" style="font-size: 28px; font-weight: 500; letter-spacing: -.02em">$36,140</span></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5C5F6A">Active publishers</span><span class="mono" style="font-size: 28px; font-weight: 500; letter-spacing: -.02em">41 <span style="font-size: 15px; color: #5C5F6A">of 58</span></span></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5C5F6A">Average accuracy</span><span class="mono" style="font-size: 28px; font-weight: 500; letter-spacing: -.02em">82.4%</span></div>
<div style="background: #FFF8EE; border: 1px solid #F3DDBE; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #8A4300">Below 70% accuracy</span><span class="mono" style="font-size: 28px; font-weight: 500; letter-spacing: -.02em; color: #8A4300">3 publishers</span></div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 10px; flex: 1 1 280px; box-sizing: border-box">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C5F6A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span class="sr">Search publishers</span>
<input type="search" placeholder="Search publishers or contacts" style="border: 0; outline: 0; flex: 1; font: 14px Geist, system-ui, sans-serif; background: transparent; color: #14161C; min-width: 0">
</label>
<label><span class="sr">Type</span><select class="sel"><option>All types</option><option>Network</option><option>Media buyer</option><option>Influencer network</option><option>Email &amp; SMS</option></select></label>
<label><span class="sr">Geo</span><select class="sel"><option>All geos</option><option>India</option><option>Philippines</option><option>Indonesia</option><option>Vietnam</option></select></label>
<label><span class="sr">Accuracy</span><select class="sel"><option>Any accuracy</option><option>Below 70%</option><option>70–85%</option><option>Above 85%</option></select></label>
<label><span class="sr">POC</span><select class="sel"><option>All POCs</option><option>My accounts</option></select></label>
</div>

<section aria-label="Publisher list" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Publisher</th><th scope="col">Type · traffic</th><th scope="col">POC</th><th scope="col" style="text-align: right">Live campaigns</th><th scope="col" style="text-align: right">Oct payout</th><th scope="col" style="text-align: right">Lifetime paid</th><th scope="col">Accuracy · 90 days</th><th scope="col">Last active</th></tr></thead>
<tbody>
<sc-for list="{{pubs}}" as="p" hint-placeholder-count="7">
<tr>
<td><a href="publisher.html" style="display: flex; align-items: center; gap: 12px; color: #14161C; text-decoration: none"><span class="av" aria-hidden="true" style="{{p.avStyle}}">{{p.ini}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{p.name}}</span><span style="font-size: 12px; color: #5C5F6A">{{p.geo}}</span></span></a></td>
<td>{{p.type}}</td>
<td>{{p.poc}}</td>
<td class="num">{{p.live}}</td>
<td class="num">{{p.oct}}</td>
<td class="num">{{p.paid}}</td>
<td><div style="display: flex; align-items: center; gap: 10px"><div style="width: 96px; height: 8px; border-radius: 999px; background: #F0F0EC; overflow: hidden"><div style="{{p.barStyle}}"></div></div><span class="mono" style="{{p.accStyle}}">{{p.acc}}</span></div></td>
<td style="color: #5C5F6A">{{p.last}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="padding: 14px 20px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A">Showing 7 of 58 publishers</div>
</section>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const tints = ['#E7ECFD;color:#2440B0', '#EEF7CF;color:#3F5200', '#FFF1DF;color:#8A4300', '#ECEBFA;color:#3A33A8', '#E8F3EA;color:#1F6B37', '#ECECE7;color:#4A4D57'];
    const ini = (n) => n.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const pubs = [
      ['ClickHive Media', 'PH · IN · ID', 'Network · display & push', 'Priya S.', 6, '$10,230', '$64,100', 91.2, 'Today'],
      ['AdNest Network', 'PH · VN', 'Network · in-app', 'Arjun M.', 5, '$8,190', '$52,700', 86.7, 'Today'],
      ['Orbit Leads', 'IN', 'Media buyer · search', 'Karan D.', 4, '$6,340', '$39,600', 78.4, 'Yesterday'],
      ['Pulse Affiliates', 'IN · PH', 'Network · incentive', 'Meera R.', 3, '$4,710', '$24,300', 64.9, 'Today'],
      ['BlueKite Ads', 'PH', 'Media buyer · social', 'Priya S.', 3, '$3,630', '$17,900', 88.1, '2 days ago'],
      ['Rapid Reach', 'ID · VN', 'Influencer network', 'Karan D.', 2, '$1,980', '$9,400', 81.0, '5 days ago'],
      ['Northstar Media', 'IN', 'Email & SMS', 'Meera R.', 0, '—', '$6,300', 66.3, '3 weeks ago']
    ].map(([name, geo, type, poc, live, oct, paid, acc, last], i) => ({
      name, geo, type, poc, live, oct, paid, last, ini: ini(name), acc: acc + '%',
      avStyle: 'background:' + tints[i % tints.length],
      barStyle: 'height:100%;border-radius:999px;width:' + acc + '%;background:' + (acc < 70 ? '#C66A00' : '#2F4FD6'),
      accStyle: acc < 70 ? 'font-size:13px;color:#9A4A00;font-weight:600' : 'font-size:13px;color:#14161C'
    }));
    return { pubs };
  }
}
</script>
</body>
</html>
