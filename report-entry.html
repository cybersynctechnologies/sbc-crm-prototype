<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<nav aria-label="Breadcrumb" style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #5C5F6A">
<a href="settlements.html" style="color: #5C5F6A; text-decoration: none">Settlements</a><span aria-hidden="true">/</span><span style="color: #14161C">Enter advertiser report</span>

<header class="ph">
<div class="ph-t">
<h1>Enter advertiser report</h1>
<p>Type in the advertiser's validated numbers for the month, or upload their sheet. Profit and margin are worked out for you.</p>
</div>
<div class="ph-a">
<label><span class="sr">Advertiser</span><select class="sel"><option>SpinArena</option><option>Nova Bank PH</option><option>Adbridge Agency</option></select></label>
<label><span class="sr">Month</span><select class="sel"><option>October 2026</option><option>September 2026</option></select></label>
<a class="btn" href="upload.html" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Upload sheet instead</a>
</div>
</header>

<sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 18px; background: #E8F3EA; border: 1px solid #BFDCC6; border-radius: 12px; font-size: 14px; color: #1F6B37">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
<span style="flex: 1 1 280px">SpinArena's October report is submitted. It now shows as <strong>Received</strong> in Settlements and feeds the dashboard and reports.</span>
<a class="btn" href="settlements.html" style="min-height: 40px; background: #FFFFFF; color: #14161C; border: 1px solid #BFDCC6">Go to Settlements</a>
</div>
</sc-if>

<section aria-label="Report totals" style="background: #0C0E14; border-radius: 18px; padding: 22px 26px; color: #FFFFFF; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Publishers reported</span><span class="mono" style="font-size: 26px; font-weight: 500">{{tRep}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Advertiser validated (Valid)</span><span class="mono" style="font-size: 26px; font-weight: 500">{{tConf}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Final billing</span><span class="mono" style="font-size: 26px; font-weight: 500">{{tBill}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Publisher billing</span><span class="mono" style="font-size: 26px; font-weight: 500">{{tPay}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Profit · margin</span><span class="mono" style="font-size: 26px; font-weight: 500; color: #D4F25A">{{tProfit}}</span><span class="mono" style="font-size: 13px; color: #A6A9B6">{{tMargin}}</span></div>
</section>

<section aria-labelledby="rows-h" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="rows-h" style="margin: 0; font-size: 17px; font-weight: 600">SpinArena · October 2026 · 3 campaigns</h2><span style="font-size: 13px; color: #5C5F6A">White boxes are typed in. Everything else is calculated.</span></div>
<span class="chip" style="background: #FFF1DF; color: #8A4300">Report due 5 Nov</span>
</div>
<div style="overflow-x: auto; border-top: 1px solid #EFEFEB">
<table>
<thead><tr><th scope="col">Campaign</th><th scope="col" style="text-align: right">Publishers reported</th><th scope="col" style="text-align: right">Valid</th><th scope="col" style="text-align: right">PO (rate)</th><th scope="col" style="text-align: right">Total</th><th scope="col" style="text-align: right">Final billing</th><th scope="col" style="text-align: right">Pub billing</th><th scope="col" style="text-align: right">Profit</th><th scope="col" style="text-align: right">Margin</th><th scope="col" style="text-align: right">Validation rate</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<tr>
<td><span style="display: block; font-weight: 500">{{r.name}}</span><span class="mono" style="display: block; font-size: 12px; color: #5C5F6A">{{r.id}} · {{r.model}}</span></td>
<td class="num" style="color: #4A4D57">{{r.rep}}</td>
<td class="num"><label><span class="sr">{{r.validLabel}}</span><input class="cellin" type="text" inputmode="numeric" value="{{r.valid}}" onChange="{{r.setValid}}"></label></td>
<td class="num"><label><span class="sr">{{r.rateLabel}}</span><input class="cellin" type="text" inputmode="decimal" value="{{r.rate}}" onChange="{{r.setRate}}" style="width: 80px"></label></td>
<td class="num">{{r.total}}</td>
<td class="num"><label><span class="sr">{{r.billLabel}}</span><input class="cellin" type="text" inputmode="decimal" value="{{r.bill}}" onChange="{{r.setBill}}" style="width: 110px"></label></td>
<td class="num" style="color: #4A4D57">{{r.pay}}</td>
<td class="num" style="font-weight: 600">{{r.profit}}</td>
<td class="num">{{r.margin}}</td>
<td class="num"><span style="{{r.accStyle}}">{{r.acc}}</span></td>
</tr>
</sc-for>
</tbody>
<tfoot><tr><td>Total</td><td class="num">{{tRep}}</td><td class="num">{{tConf}}</td><td></td><td class="num">{{tTotal}}</td><td class="num">{{tBill}}</td><td class="num">{{tPay}}</td><td class="num">{{tProfit}}</td><td class="num">{{tMargin}}</td><td class="num">{{tAcc}}</td></tr></tfoot>
</table>
</div>
<div style="padding: 14px 20px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A">Publishers reported and Pub billing come from Daily entry. Final billing starts as Total (Valid × PO) and can be changed, for example when one bill covers several campaigns.</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="att-h" style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="att-h" style="margin: 0; font-size: 16px; font-weight: 600">Advertiser's report file</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px dashed #C9C9C2; border-radius: 12px; background: #FAFAF8">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C5F6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg>
<span style="font-size: 13px; color: #5C5F6A; flex: 1">Attach the report they sent (Excel, CSV, PDF or email) so anyone can check it later</span>
<button type="button" class="btn" style="background: #FFFFFF; border: 1px solid #E2E2DC; color: #14161C">Browse</button>
</div>
</section>
<section aria-labelledby="note-h" style="flex: 1 1 320px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="note-h" style="margin: 0; font-size: 16px; font-weight: 600">Notes</h2>
<label><span class="sr">Notes</span><textarea rows="3" placeholder="e.g. 54 rejected as duplicates; Web registration billed together with Sports promo" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E2E2DC; border-radius: 10px; font: 14px Geist, system-ui, sans-serif; resize: vertical"></textarea></label>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end">
<button type="button" class="btn b2">Save draft</button>
<button type="button" class="btn" onClick="{{submit}}" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Submit report</button>
</div>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const ed = s.ed || {};
    const base = [
      ['3731', 'Android FTD', 'CPA', 412, 346, 45, 11626],
      ['3744', 'Web registration', 'CPR', 980, 700, 3.2, 1650],
      ['3733', 'Sports promo deposit', 'CPA', 24, 20, 39, 584]
    ];
    const num = (x) => { const n = parseFloat(String(x).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
    const usd = (n) => '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    const set = (k) => (e) => this.setState({ ed: Object.assign({}, ed, { [k]: e.target.value }) });
    let tRep = 0, tConf = 0, tTotal = 0, tBill = 0, tPay = 0;
    const rows = base.map(([id, name, model, rep, valid0, rate0, pay], i) => {
      const valid = (('v' + i) in ed) ? ed['v' + i] : String(valid0);
      const rate = (('r' + i) in ed) ? ed['r' + i] : String(rate0);
      const total = num(valid) * num(rate);
      const bill = (('b' + i) in ed) ? ed['b' + i] : String(Math.round(total * 100) / 100);
      const billN = num(bill), profit = billN - pay;
      const acc = rep ? num(valid) / rep * 100 : 0;
      tRep += rep; tConf += num(valid); tTotal += total; tBill += billN; tPay += pay;
      return {
        id, name, model, rep: rep.toLocaleString('en-US'), valid, rate, bill,
        total: usd(total), pay: usd(pay), profit: usd(profit),
        margin: billN ? (profit / billN * 100).toFixed(1) + '%' : '—',
        acc: acc.toFixed(1) + '%', accStyle: acc < 70 ? 'color:#9A4A00;font-weight:600' : 'color:#14161C',
        validLabel: 'Valid conversions for ' + name, rateLabel: 'Rate for ' + name, billLabel: 'Final billing for ' + name,
        setValid: set('v' + i), setRate: set('r' + i), setBill: set('b' + i)
      };
    });
    const tProfitN = tBill - tPay;
    return {
      rows, submitted: !!s.submitted, submit: () => this.setState({ submitted: true }),
      tRep: tRep.toLocaleString('en-US'), tConf: tConf.toLocaleString('en-US'), tTotal: usd(tTotal), tBill: usd(tBill), tPay: usd(tPay),
      tProfit: usd(tProfitN), tMargin: tBill ? (tProfitN / tBill * 100).toFixed(1) + '%' : '—',
      tAcc: tRep ? (tConf / tRep * 100).toFixed(1) + '%' : '—'
    };
  }
}
</script>
</body>
</html>
