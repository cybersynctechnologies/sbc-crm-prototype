<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header class="ph">
<div class="ph-t">
<h1>Settlements</h1>
<p>Match what publishers reported with what advertisers validated, then settle the month</p>
</div>
<div class="ph-a">
<label><span class="sr">Month</span><select class="sel"><option>October 2026</option><option>September 2026</option><option>August 2026</option></select></label>
<a class="btn" href="reports.html" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Export</a>
<a class="btn" href="upload.html" style="background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Upload sheet</a>
<a class="btn" href="report-entry.html" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Enter advertiser report</a>
</div>
</header>

<ol aria-label="How a month is settled" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
<li style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px"><span class="mono" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #0C0E14; color: #D4F25A; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: none">✓</span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Publisher numbers in</span><span style="font-size: 12px; color: #5C5F6A">23 of 23 campaigns</span></div></li>
<li style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #FFFFFF; border: 1px solid #0C0E14; border-radius: 14px"><span class="mono" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">2</span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Advertiser reports in</span><span style="font-size: 12px; color: #5C5F6A">16 of 23 · 7 pending</span></div></li>
<li style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px"><span class="mono" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #ECECE7; color: #4A4D57; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">3</span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Resolve disputes</span><span style="font-size: 12px; color: #5C5F6A">1 open</span></div></li>
<li style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 14px"><span class="mono" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #ECECE7; color: #4A4D57; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">4</span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Settle &amp; pay publishers</span><span style="font-size: 12px; color: #5C5F6A">6 of 23 settled</span></div></li>
</ol>

<section aria-label="October so far" style="background: #0C0E14; border-radius: 18px; padding: 24px 28px; color: #FFFFFF; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Revenue validated so far</span><span class="mono" style="font-size: 28px; font-weight: 500">$38,160</span><span style="font-size: 12px; color: #A6A9B6">from 16 reports</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Still waiting on</span><span class="mono" style="font-size: 28px; font-weight: 500">≈ $10,760</span><span style="font-size: 12px; color: #A6A9B6">7 reports, est. from publisher numbers</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Payout to settle</span><span class="mono" style="font-size: 28px; font-weight: 500">$28,180</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #A6A9B6">Margin validated</span><span class="mono" style="font-size: 28px; font-weight: 500; color: #D4F25A">$9,980</span></div>

<div role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}} <span class="mono" style="font-size: 12px; opacity: .75">{{f.count}}</span></button>
</sc-for>
</div>

<section aria-label="Settlement list" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Advertiser · campaign</th><th scope="col">Status</th><th scope="col" style="text-align: right">Publishers reported</th><th scope="col" style="text-align: right">Advertiser validated</th><th scope="col" style="text-align: right">Settled</th><th scope="col" style="text-align: right">Validation rate</th><th scope="col" style="text-align: right">Revenue</th><th scope="col" style="text-align: right">Payout</th><th scope="col" style="text-align: right">Margin</th><th scope="col"><span class="sr">Action</span></th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<tr>
<td><a href="campaign.html" style="color: #14161C; font-weight: 500; text-decoration: none">{{r.adv}}</a><div style="font-size: 12px; color: #5C5F6A; margin-top: 2px">{{r.camp}} · {{r.poc}}</div></td>
<td><span class="chip" style="{{r.chip}}">{{r.status}}</span><div style="font-size: 12px; color: #5C5F6A; margin-top: 4px">{{r.note}}</div></td>
<td class="num">{{r.rep}}</td>
<td class="num">{{r.conf}}</td>
<td class="num">{{r.set}}</td>
<td class="num">{{r.acc}}</td>
<td class="num">{{r.rev}}</td>
<td class="num">{{r.pay}}</td>
<td class="num" style="font-weight: 600">{{r.mar}}</td>
<td><a class="btn" href="{{r.href}}" style="{{r.ctaStyle}}">{{r.cta}}</a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.f) || 'All';
    const on = 'display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #0C0E14;background:#0C0E14;color:#FFFFFF;font:600 14px Geist,system-ui,sans-serif;cursor:pointer';
    const off = 'display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #E2E2DC;background:#FFFFFF;color:#14161C;font:500 14px Geist,system-ui,sans-serif;cursor:pointer';
    const filters = [['All', 23], ['Pending', 7], ['Received', 9], ['Disputed', 1], ['Settled', 6]].map(([label, count]) => ({
      label, count, pressed: String(label === sel), style: label === sel ? on : off, pick: () => this.setState({ f: label })
    }));
    const chip = { Pending: 'background:#FFF1DF;color:#8A4300', Received: 'background:#E7ECFD;color:#2440B0', Disputed: 'background:#FBE7E9;color:#9B1C2C', Settled: 'background:#E8F3EA;color:#1F6B37' };
    const dark = 'min-height:40px;background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14';
    const light = 'min-height:40px;background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC';
    const all = [
      ['SpinArena', 'Android FTD', 'Arjun M.', 'Received', 'arrived 2 Nov', '412', '346', '346', '84.0%', '$15,570', '$11,626', '$3,944', 'Mark settled', 'campaign.html', dark],
      ['Adbridge Agency', 'Kredo Card approval', 'Karan D.', 'Disputed', '54 rejected as duplicates', '470', '416', '—', '88.5%', '$8,320', '$6,240', '$2,080', 'Resolve', 'campaign.html', dark],
      ['Nova Bank PH', 'Savings account', 'Priya S.', 'Pending', 'due 5 Nov', '5,380', '—', '—', '—', '—', '—', '—', 'Enter report', 'report-entry.html', light],
      ['Pocket Rummy', 'Install + registration', 'Arjun M.', 'Pending', 'due 5 Nov', '15,200', '—', '—', '—', '—', '—', '—', 'Enter report', 'report-entry.html', light],
      ['ShieldCare Insurance', 'Health insurance lead', 'Meera R.', 'Settled', 'settled 1 Nov', '640', '588', '588', '91.9%', '$2,940', '$2,180', '$760', 'View', 'campaign.html', light],
      ['Lumi Lending', 'Personal loan disbursal', 'Karan D.', 'Settled', 'settled 31 Oct', '82', '73', '73', '89.0%', '$1,460', '$1,050', '$410', 'View', 'campaign.html', light]
    ];
    const rows = all.filter((r) => sel === 'All' || r[3] === sel).map(([adv, camp, poc, status, note, rep, conf, set, acc, rev, pay, mar, cta, href, ctaStyle]) => ({
      adv, camp, poc, status, note, rep, conf, set, acc, rev, pay, mar, cta, href, ctaStyle, chip: chip[status]
    }));
    return { filters, rows };
  }
}
</script>
