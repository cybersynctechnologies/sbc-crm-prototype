<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Team and roles</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:14px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAF8}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:44px;padding:0 12px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ui-kit: shared across every screen */
main{gap:24px!important}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.ph-t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px;max-width:760px}
.ph-t h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em}
.ph-t p{margin:0;font-size:14px;color:#5C5F6A;line-height:1.5}
.ph-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;align-self:flex-start;flex-wrap:wrap;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px;max-width:100%;box-sizing:border-box}
.tabs>button,.tabs>a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;text-decoration:none;cursor:pointer;white-space:nowrap}
.tabs>button:hover,.tabs>a:hover{color:#14161C}
.tabs>[aria-selected="true"],.tabs>[aria-pressed="true"],.tabs>[aria-current="page"]{background:#FFFFFF;color:#14161C;font-weight:600;box-shadow:0 1px 2px rgba(12,14,20,.08)}
.tabs .ct{font:500 11px 'Geist Mono',ui-monospace,monospace;color:#8A8D98}
.b1{background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14}
.b2{background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC}
.b2:hover{border-color:#C9C9C2}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2F4FD6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="validation.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>Validation</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav" href="upload.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="categories.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="fields.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Fields &amp; formulas</a>
<a class="nav on" href="team.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header class="ph">
<div class="ph-t">
<h1>Team &amp; roles</h1>
<p>Who's on the team, the accounts they handle, and what each role can see and do</p>
</div>
<div class="ph-a"><button type="button" class="btn b1">+ Invite team member</button></div>
</header>

<div class="tabs" role="tablist" aria-label="Team view">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{isMembers}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
<span style="font-size: 14px; color: #5C5F6A">6 people · October 2026</span>
<label><span class="sr">Period</span><select class="sel"><option>Last month · October 2026</option><option>This quarter</option><option>This financial year</option><option>Custom range…</option></select></label>
</div>
<section aria-label="Team members" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Member</th><th scope="col">Role</th><th scope="col" style="text-align: right">Advertisers</th><th scope="col" style="text-align: right">Publishers</th><th scope="col" style="text-align: right">Revenue handled</th><th scope="col" style="text-align: right">Margin</th><th scope="col" style="text-align: right">Publisher validation rate</th><th scope="col">Last active</th></tr></thead>
<tbody>
<sc-for list="{{members}}" as="m" hint-placeholder-count="6">
<tr>
<td><div style="display: flex; align-items: center; gap: 12px"><span class="av" aria-hidden="true" style="{{m.avStyle}}">{{m.ini}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{m.name}}</span><span class="mono" style="font-size: 12px; color: #5C5F6A">{{m.email}}</span></span></div></td>
<td><span class="chip" style="{{m.roleStyle}}">{{m.role}}</span></td>
<td class="num">{{m.adv}}</td>
<td class="num">{{m.pub}}</td>
<td class="num">{{m.rev}}</td>
<td class="num" style="font-weight: 600">{{m.mar}}</td>
<td class="num">{{m.acc}}</td>
<td style="color: #5C5F6A">{{m.last}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</div>
</sc-if>

<sc-if value="{{isRoles}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
<div role="group" aria-label="Roles" style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}"><span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 600">{{r.label}}</span><span style="{{r.subStyle}}">{{r.sub}}</span></span></button>
</sc-for>
<button type="button" class="btn" style="justify-content: center; background: transparent; color: #14161C; border: 1px dashed #C9C9C2">+ New role</button>
</div>
<section aria-labelledby="perm-h" style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="perm-h" style="margin: 0; font-size: 18px; font-weight: 600">{{roleName}} can…</h2><span style="font-size: 13px; color: #5C5F6A">Changes apply to everyone with this role straight away</span></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #5C5F6A; padding-bottom: 6px">{{g.title}}</span>
<sc-for list="{{g.items}}" as="p" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; border-bottom: 1px solid #EFEFEB">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{p.label}}</span><span style="font-size: 13px; color: #5C5F6A">{{p.help}}</span></span>
<button type="button" role="switch" aria-checked="{{p.checked}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" style="{{p.track}}"><span aria-hidden="true" style="{{p.knob}}"></span></button>
</div>
</sc-for>
</div>
</sc-for>
</section>
</div>
</sc-if>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'members', role = s.role || 'am', over = s.over || {};
    const tOn = 'min-height:40px;padding:0 18px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px #0000001a;font:600 14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const tOff = 'min-height:40px;padding:0 18px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;cursor:pointer';
    const tabs = [['members', 'Members'], ['roles', 'Roles & permissions']].map(([id, label]) => ({
      label, selected: String(id === tab), style: id === tab ? tOn : tOff, pick: () => this.setState({ tab: id })
    }));
    const rs = { Admin: 'background:#0C0E14;color:#FFFFFF', 'Account manager': 'background:#E7ECFD;color:#2440B0', Finance: 'background:#EEF7CF;color:#3F5200' };
    const tints = ['#ECECE7;color:#4A4D57', '#E7ECFD;color:#2440B0', '#FFF1DF;color:#8A4300', '#ECEBFA;color:#3A33A8', '#E8F3EA;color:#1F6B37', '#EEF7CF;color:#3F5200'];
    const members = [
      ['Rohit V.', 'rohit@[company].com', 'Admin', 'All', 'All', '$48,920', '$12,780', '82.4%', 'Today'],
      ['Arjun M.', 'arjun@[company].com', 'Account manager', '5', '11', '$25,440', '$6,840', '84.1%', 'Today'],
      ['Priya S.', 'priya@[company].com', 'Account manager', '4', '9', '$10,760', '$2,690', '89.6%', 'Now'],
      ['Karan D.', 'karan@[company].com', 'Account manager', '6', '8', '$9,780', '$2,490', '80.2%', 'Yesterday'],
      ['Meera R.', 'meera@[company].com', 'Account manager', '3', '7', '$2,940', '$760', '68.7%', 'Today'],
      ['Neha J.', 'neha@[company].com', 'Finance', '—', '—', '—', '—', '—', '2 days ago']
    ].map(([name, email, r, adv, pub, rev, mar, acc, last], i) => ({
      name, email, role: r, adv, pub, rev, mar, acc, last,
      ini: name.split(' ').map((w) => w[0]).join('').slice(0, 2), roleStyle: rs[r], avStyle: 'background:' + tints[i]
    }));
    const R = {
      admin: ['Admin', '1 person · full access', { rev: 1, pay: 1, mar: 1, all: 1, camp: 1, up: 1, settle: 1, bc: 1, exp: 1, team: 1 }],
      am: ['Account manager', '4 people', { rev: 1, pay: 1, mar: 0, all: 0, camp: 1, up: 1, settle: 0, bc: 1, exp: 0, team: 0 }],
      fin: ['Finance', '1 person', { rev: 1, pay: 1, mar: 1, all: 1, camp: 0, up: 1, settle: 1, bc: 0, exp: 1, team: 0 }]
    };
    const rOn = 'display:flex;align-items:center;min-height:64px;padding:0 16px;border:1.5px solid #0C0E14;border-radius:12px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const rOff = 'display:flex;align-items:center;min-height:64px;padding:0 16px;border:1px solid #E2E2DC;border-radius:12px;background:#FAFAF8;font:14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer';
    const roles = Object.keys(R).map((id) => ({
      label: R[id][0], sub: R[id][1], pressed: String(id === role), style: id === role ? rOn : rOff,
      subStyle: 'font-size:12px;color:#5C5F6A', pick: () => this.setState({ role: id })
    }));
    const val = (k) => { const key = role + '.' + k; return key in over ? over[key] : !!R[role][2][k]; };
    const sw = (k, label, help) => {
      const on = val(k);
      return {
        label, help, checked: String(on),
        toggle: () => this.setState({ over: Object.assign({}, over, { [role + '.' + k]: !on }) }),
        track: 'position:relative;flex:none;width:52px;height:30px;border-radius:999px;border:0;cursor:pointer;background:' + (on ? '#0C0E14' : '#D6D6D0'),
        knob: 'position:absolute;top:3px;left:' + (on ? '25px' : '3px') + ';width:24px;height:24px;border-radius:50%;background:' + (on ? '#D4F25A' : '#FFFFFF') + ';box-shadow:0 1px 2px #00000033'
      };
    };
    const groups = [
      { title: 'See', items: [
        sw('rev', 'Revenue', 'What advertisers pay us'),
        sw('pay', 'Publisher payouts', 'What we pay publishers'),
        sw('mar', 'Margin', 'Revenue minus payout, on every screen and export'),
        sw('all', 'Every account', 'Off: only advertisers and publishers they are POC for')
      ] },
      { title: 'Do', items: [
        sw('camp', 'Create and edit campaigns', 'Including payouts and publisher assignments'),
        sw('up', 'Upload Excel files', 'Publisher numbers, advertiser reports, history'),
        sw('settle', 'Settle a month', 'Lock final numbers and mark publishers to be paid'),
        sw('bc', 'Send broadcasts', 'Teams and email to publishers, advertisers or team'),
        sw('exp', 'Export data', 'Excel, CSV and PDF downloads'),
        sw('team', 'Manage team and roles', 'Invite people and change these settings')
      ] }
    ];
    return { tabs, members, roles, groups, roleName: R[role][0], isMembers: tab === 'members', isRoles: tab === 'roles' };
  }
}
</script>
</body>
</html>
