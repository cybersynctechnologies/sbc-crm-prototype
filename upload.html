<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBC CRM · Excel upload</title>
<script src="dc.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F1}
a{color:#2F4FD6}a:hover{color:#2440B0}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:#B9BBC6;text-decoration:none;font-size:14px;font-weight:500}
.nav:hover{background:#1C1F28;color:#FFFFFF}
.nav.on{background:#1F2330;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2C3142}
.nav svg{flex:none}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:#5C5F6A;text-align:left;padding:12px 16px;border-bottom:1px solid #E6E6E1;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;background:#FAFAF8}
td{font-size:14px;color:#14161C;padding:12px 16px;border-bottom:1px solid #EFEFEB;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{font-family:'Geist Mono',ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font:600 14px Geist,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.sel{min-height:40px;padding:0 10px;border:1px solid #E2E2DC;border-radius:10px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.radio{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #E2E2DC;border-radius:12px;font-size:14px;cursor:pointer}
.radio input{width:18px;height:18px;margin:1px 0 0;accent-color:#0C0E14}
/* ui-kit: shared across every screen */
main{gap:24px!important}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.ph-t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 420px;max-width:760px}
.ph-t h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.025em}
.ph-t p{margin:0;font-size:14px;color:#5C5F6A;line-height:1.5}
.ph-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;align-self:flex-start;flex-wrap:wrap;gap:4px;padding:4px;background:#E9E9E4;border-radius:12px;max-width:100%;box-sizing:border-box}
.tabs>button,.tabs>a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;font:500 14px Geist,system-ui,sans-serif;color:#4A4D57;text-decoration:none;cursor:pointer;white-space:nowrap}
.tabs>button:hover,.tabs>a:hover{color:#14161C}
.tabs>[aria-selected="true"],.tabs>[aria-pressed="true"],.tabs>[aria-current="page"]{background:#FFFFFF;color:#14161C;font-weight:600;box-shadow:0 1px 2px rgba(12,14,20,.08)}
.tabs .ct{font:500 11px 'Geist Mono',ui-monospace,monospace;color:#8A8D98}
.b1{background:#0C0E14;color:#FFFFFF;border:1px solid #0C0E14}
.b2{background:#FFFFFF;color:#14161C;border:1px solid #E2E2DC}
.b2:hover{border-color:#C9C9C2}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #2F4FD6;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, -apple-system, sans-serif; color: #14161C; background: #F4F4F1">
<nav aria-label="Main" style="flex: 1 1 236px; background: #0C0E14; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4F25A; color: #0C0E14; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em">SBC</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-weight: 600; font-size: 15px; letter-spacing: -.01em">SBC CRM</span><span style="color: #9093A0; font-size: 12px">[Company name]</span></div>
</div>
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Dashboard</a>
<a class="nav" href="daily-entry.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M9 4v17M15 4v17"></path></svg>Daily entry</a>
<a class="nav" href="validation.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M8 21h8"></path></svg>Validation</a>
<a class="nav" href="campaigns.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"></path><path d="M7 13v5a2 2 0 0 0 4 0v-4"></path></svg>Campaigns</a>
<a class="nav" href="advertisers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>Advertisers</a>
<a class="nav" href="publishers.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18.5 14.5A6.5 6.5 0 0 1 21.5 20"></path></svg>Publishers</a>
<a class="nav" href="settlements.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>Settlements</a>
<a class="nav" href="reports.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M6 17V11M11 17V5M16 17v-8M21 17v-4"></path></svg>Reports</a>
<a class="nav on" href="upload.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Excel upload</a>
<a class="nav" href="broadcast.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>Broadcast</a>
<div style="height: 1px; background: #1F2330; margin: 14px 10px"></div>
<a class="nav" href="categories.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Categories</a>
<a class="nav" href="fields.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Fields &amp; formulas</a>
<a class="nav" href="currencies.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg>Currencies &amp; geos</a>
<a class="nav" href="team.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Team &amp; roles</a>
<div style="margin-top: auto; padding: 18px 10px 4px; display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #262A37; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFFFFF; font-size: 13px; font-weight: 500">Priya S.</span><span style="color: #9093A0; font-size: 12px">Account manager</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<header class="ph">
<div class="ph-t"><h1>Excel upload</h1>
<p>Bring in advertiser reports and publisher sheets exactly as they arrive, or use the SBC templates. Match the columns once per format and every upload after that is one click.</p>
</div>
</header>

<div class="tabs" role="tablist" aria-label="Excel upload">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}<span class="ct">{{t.count}}</span></button></sc-for>
</div>

<sc-if value="{{isUpload}}" hint-placeholder-val="{{ true }}">

<ol aria-label="Upload steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li style="{{s.style}}"><span class="mono" aria-hidden="true" style="{{s.dot}}">{{s.mark}}</span>{{s.label}}</li>
</sc-for>
</ol>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<section aria-label="Uploaded file" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: #E8F3EA; color: #1F6B37; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">XLSX</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 220px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">SpinArena FD validation Oct.xlsx</span>
<span style="font-size: 13px; color: #5C5F6A">4,384 rows · 28 columns · uploaded by Arjun M. just now</span>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5C5F6A">Sheet<select class="sel"><option>Validation export</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5C5F6A">What is this file?<select class="sel"><option>Advertiser report</option><option>Publisher numbers</option><option>Campaign list</option><option>Publisher or advertiser list</option><option>Past data (history)</option></select></label>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 18px; background: #EEF7CF; border: 1px solid #D9EAA0; border-radius: 12px; font-size: 14px; color: #3F5200">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
<span style="flex: 1 1 280px">Recognised as <strong>SpinArena · FD validation export</strong> (used 3 times). <strong>Each row is one validated deposit</strong>, so we count rows per publisher, campaign and day.</span>
<button type="button" class="btn" style="min-height: 40px; background: #FFFFFF; color: #14161C; border: 1px solid #D9EAA0">Change mapping</button>
</div>

<section aria-labelledby="map" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="map" style="margin: 0; font-size: 16px; font-weight: 600">Match your columns</h2>
<span style="font-size: 13px; color: #5C5F6A">28 columns found · 9 used · 19 skipped</span>
</div>
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">Column in your sheet</th><th scope="col">Sample values</th><th scope="col">Goes into</th><th scope="col">Check</th></tr></thead>
<tbody>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="9">
<tr>
<td><span class="mono" style="font-size: 13px; padding: 3px 8px; background: #F0F0EC; border-radius: 6px">{{c.col}}</span></td>
<td style="color: #5C5F6A; font-size: 13px">{{c.sample}}</td>
<td><label><span class="sr">{{c.selLabel}}</span><select class="sel" style="min-width: 220px"><option>{{c.field}}</option><option>Skip this column</option></select></label></td>
<td><span style="{{c.okStyle}}">{{c.ok}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
<section aria-labelledby="rules" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="rules" style="margin: 0; font-size: 16px; font-weight: 600">How to read this file</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px">
<label class="radio"><input type="radio" name="shape" checked=""><span><strong style="font-weight: 600">One row = one conversion</strong><br><span style="font-size: 13px; color: #5C5F6A">Count the rows. Used by most advertiser exports.</span></span></label>
<label class="radio"><input type="radio" name="shape"><span><strong style="font-weight: 600">One row = a total</strong><br><span style="font-size: 13px; color: #5C5F6A">Take the number from a count column, e.g. daily sheets.</span></span></label>
</div>
<ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; color: #2A2D36">
<li>Count only rows where <span class="mono">event_type</span> is <span class="mono">FD</span> (first deposit)</li>
<li>Leave out rows where <span class="mono">source_flag</span> is <span class="mono">blocked</span> · 4 rows</li>
<li>Rows with no publisher code go to <strong>Not attributed</strong> · 31 rows, not paid</li>
<li>Same <span class="mono">user_id</span> twice in a month counts once · 0 found</li>
</ul>
</section>
</div>

<aside aria-label="Before you import" style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 18px">
<section aria-labelledby="fix" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 id="fix" style="margin: 0; font-size: 16px; font-weight: 600">2 publisher codes we don't know yet</h2>
<p style="margin: 0; font-size: 13px; color: #5C5F6A">Advertisers use their own codes for our publishers. Match a code once and it is remembered.</p>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid #F3DDBE; background: #FFF8EE; border-radius: 12px">
<span style="font-size: 14px"><span class="mono">ch_push</span> · 39 rows</span>
<span style="font-size: 13px; color: #5C5F6A">Tracking link belongs to <strong style="color: #14161C">ClickHive Media</strong></span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn" style="min-height: 40px; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Use ClickHive Media</button><button type="button" class="btn" style="min-height: 40px; background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Pick another</button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid #F3DDBE; background: #FFF8EE; border-radius: 12px">
<span style="font-size: 14px"><span class="mono">nx_ads_31</span> · 12 rows</span>
<span style="font-size: 13px; color: #5C5F6A">No tracking link with this code</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn" style="min-height: 40px; background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Pick publisher</button><button type="button" class="btn" style="min-height: 40px; background: #FFFFFF; color: #14161C; border: 1px solid #E2E2DC">Mark not attributed</button></div>
</div>
</section>

<section aria-labelledby="dupe" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="dupe" style="margin: 0; font-size: 16px; font-weight: 600">October from SpinArena: first upload</h2>
<p style="margin: 0; font-size: 13px; color: #5C5F6A">If they send a corrected file later, upload it here. You choose what happens to existing rows.</p>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
<legend class="sr">What to do with rows that already exist</legend>
<label class="radio"><input type="radio" name="dupe" checked=""><span><strong style="font-weight: 600">Update them</strong><br><span style="font-size: 13px; color: #5C5F6A">Recommended. Newer numbers replace older ones.</span></span></label>
<label class="radio"><input type="radio" name="dupe"><span><strong style="font-weight: 600">Skip them</strong><br><span style="font-size: 13px; color: #5C5F6A">Only add rows that are new.</span></span></label>
</fieldset>
</section>

<div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap">
<button type="button" class="btn b2">Back</button>
<a class="btn" href="validation.html" style="background: #0C0E14; color: #FFFFFF; border: 1px solid #0C0E14">Check and compare →</a>
</div>
</aside>
</div>

<section aria-labelledby="hist" style="background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="padding: 18px 24px"><h2 id="hist" style="margin: 0; font-size: 16px; font-weight: 600">Recent uploads</h2></div>
<div style="overflow-x: auto">
<table>
<thead><tr><th scope="col">File</th><th scope="col">Type</th><th scope="col" style="text-align: right">Rows</th><th scope="col">By</th><th scope="col">When</th><th scope="col">Result</th></tr></thead>
<tbody>
<sc-for list="{{hist}}" as="h" hint-placeholder-count="4">
<tr><td style="font-weight: 500">{{h.file}}</td><td>{{h.type}}</td><td class="num">{{h.rows}}</td><td>{{h.by}}</td><td style="color: #5C5F6A">{{h.when}}</td><td><span class="chip" style="{{h.chip}}">{{h.result}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</sc-if>

<sc-if value="{{isTemplates}}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="master" style="background: #0C0E14; color: #FFFFFF; border-radius: 18px; padding: 24px 28px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#ffffff0d 1px, transparent 1px); background-size: 18px 18px"></div>
<div style="position: relative; flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #A6A9B6">Default template</span>
<h2 id="master" style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em">SBC master workbook</h2>
<p style="margin: 0; font-size: 14px; color: #B9BBC6; line-height: 1.55">One Excel file with a sheet for every kind of update. Fill in the sheets you need and leave the rest empty, then upload the whole file here. Your custom fields are added as extra columns automatically.</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px"><button type="button" class="btn" style="background: #D4F25A; color: #0C0E14; border: 0">Download workbook (.xlsx)</button><button type="button" class="btn" style="background: transparent; color: #FFFFFF; border: 1px solid #3A3F50">Download with sample rows</button></div>
</div>
<ol aria-label="Sheets in the workbook" style="position: relative; flex: 1 1 380px; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 8px">
<sc-for list="{{sheets}}" as="h" hint-placeholder-count="8"><li style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #1C1F28; box-shadow: inset 0 0 0 1px #2C3142; font-size: 14px"><span class="mono" style="font-size: 11px; color: #D4F25A">{{h.n}}</span>{{h.name}}</li></sc-for>
</ol>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-labelledby="tpl" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 id="tpl" style="margin: 0 0 2px; font-size: 16px; font-weight: 600">One sheet per update</h2>
<sc-for list="{{tpls}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}"><span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-weight: 600">{{t.name}}</span><span style="font-size: 13px; color: #5C5F6A; font-weight: 400">{{t.when}}</span></span><span class="mono" style="font-size: 12px; color: #5C5F6A; flex: none">{{t.cols}} cols</span></button>
</sc-for>
</section>

<section aria-labelledby="tpl-d" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px; overflow: hidden">
<div style="padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 280px"><h2 id="tpl-d" style="margin: 0; font-size: 18px; font-weight: 600">{{tpl.name}}</h2><span style="font-size: 14px; color: #5C5F6A; line-height: 1.5">{{tpl.about}}</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn b2" style="min-height: 40px">CSV</button><button type="button" class="btn b1" style="min-height: 40px">Download .xlsx</button></div>
</div>
<div style="padding: 0 24px 18px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tpl.chips}}" as="c" hint-placeholder-count="10"><span style="{{c.style}}">{{c.name}}<span style="opacity: .7; font-weight: 400"> · {{c.need}}</span></span></sc-for>
</div>
<div style="overflow-x: auto; border-top: 1px solid #EFEFEB">
<table><thead><tr><sc-for list="{{tpl.head}}" as="h" hint-placeholder-count="6"><th scope="col">{{h}}</th></sc-for></tr></thead>
<tbody><sc-for list="{{tpl.rows}}" as="r" hint-placeholder-count="3"><tr><sc-for list="{{r}}" as="c" hint-placeholder-count="6"><td style="color: #4A4D57">{{c}}</td></sc-for></tr></sc-for></tbody></table>
</div>
<p style="margin: 0; padding: 14px 24px; border-top: 1px solid #EFEFEB; font-size: 13px; color: #5C5F6A; line-height: 1.5">Sample rows show the layout. Column names can be in any order. If an advertiser or publisher won't use this layout, upload their own file and match the columns once; it's saved under Saved formats.</p>
</section>
</div>
</sc-if>

<sc-if value="{{isFormats}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-labelledby="saved" style="flex: 999 1 560px; min-width: 0; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px">
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 4px"><h2 id="saved" style="margin: 0; font-size: 16px; font-weight: 600">Saved formats</h2><span style="font-size: 13px; color: #5C5F6A">Each advertiser's or team's own layout, matched once. Picked automatically when an upload looks the same.</span></div>
<div style="overflow-x: auto"><table>
<thead><tr><th scope="col">Format</th><th scope="col">Comes from</th><th scope="col">Shape</th><th scope="col" style="text-align: right">Columns used</th><th scope="col">Rules</th><th scope="col">Last used</th></tr></thead>
<tbody><sc-for list="{{formats}}" as="f" hint-placeholder-count="5"><tr><td style="font-weight: 500">{{f.name}}</td><td>{{f.from}}</td><td>{{f.shape}}</td><td class="num">{{f.cols}}</td><td style="font-size: 13px; color: #4A4D57">{{f.rules}}</td><td style="color: #5C5F6A">{{f.used}}</td></tr></sc-for></tbody>
</table></div>
</section>
<section aria-labelledby="codes" style="flex: 1 1 340px; min-width: 0; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E6E1; border-radius: 16px">
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 4px"><h2 id="codes" style="margin: 0; font-size: 16px; font-weight: 600">Advertiser codes for our publishers</h2><span style="font-size: 13px; color: #5C5F6A">Learnt from uploads. Edit a match here if it's wrong.</span></div>
<div style="overflow-x: auto"><table>
<thead><tr><th scope="col">Their code</th><th scope="col">Our publisher</th></tr></thead>
<tbody><sc-for list="{{codes}}" as="c" hint-placeholder-count="6"><tr><td><span class="mono" style="font-size: 13px; padding: 3px 8px; background: #F0F0EC; border-radius: 6px">{{c.code}}</span><div style="font-size: 12px; color: #5C5F6A; margin-top: 4px">{{c.adv}}</div></td><td>{{c.pub}}</td></tr></sc-for></tbody>
</table></div>
</section>
</div>
</sc-if>
</main>
</div>
</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'upload', tp = s.tp || 'adv';
    const formats = [
      ['FD validation export', 'SpinArena', 'One row per deposit', 9, 'Only FD · skip blocked · dedupe by user ID', '4 Nov'],
      ['Monthly approvals', 'Nova Bank PH', 'Monthly totals', 5, 'Approved status only', '2 Nov'],
      ['Leads with status', 'ShieldCare Insurance', 'One row per lead', 6, 'Count “qualified” only', '1 Nov'],
      ['Ops monthly tracker', 'Our team', 'Daily totals', 8, 'Publisher tab per sheet', '28 Oct'],
      ['SBC master workbook', 'Anyone', 'Either', 'All', 'None needed', '27 Oct']
    ].map(([name, from, shape, cols, rules, used]) => ({ name, from, shape, cols, rules, used }));
    const codes = [['clickhive', 'SpinArena', 'ClickHive Media'], ['ch_push', 'SpinArena', 'ClickHive Media · push source'], ['adnest_ph', 'SpinArena', 'AdNest Network'], ['orbit_l', 'SpinArena', 'Orbit Leads'], ['AFF-2207', 'Nova Bank PH', 'Pulse Affiliates'], ['bk-ads', 'ShieldCare Insurance', 'BlueKite Ads']].map(([code, adv, pub]) => ({ code, adv, pub }));
    const R = 'required', O = 'optional';
    const T = [
      ['daily', 'Publisher daily numbers', 'What each publisher reports, day by day', 'The numbers your team enters in Daily entry, for when it is easier to paste a whole sheet.', [['Date', R], ['Publisher', R], ['Campaign', R], ['Reported conversions', R], ['Traffic source / sub ID', O], ['Clicks', O], ['Notes', O], ['Your custom fields', O]], [['2026-11-01', 'ClickHive Media', 'SpinArena · Android FTD', '42', 'ch_main', '1,880'], ['2026-11-01', 'AdNest Network', 'SpinArena · Android FTD', '19', 'an_ph_07', '960']]],
      ['adv', 'Advertiser validation report', 'What the advertiser validated. Only these are billed and paid', 'Use when the advertiser is happy to send this layout. Either one row per conversion, or one row per day with a count.', [['Date', R], ['Advertiser', R], ['Campaign or offer ID', R], ['Publisher or their code', R], ['Validated conversions', 'or one row each'], ['Conversion ID', 'finds duplicates'], ['Status', O], ['Payout and currency', O], ['First deposit amount', O], ['Your custom fields', O]], [['2026-10-01', 'SpinArena', 'sp_cpa', 'clickhive', '1', '1786003489-67850'], ['2026-10-01', 'SpinArena', 'sp_cpa', 'adnest_ph', '1', '1786003490-11024']]],
      ['camp', 'New campaigns', 'Add or update many campaigns at once', 'One row per campaign. KPI type is Hard (deposit, loan, approval) or Soft (click, lead, install).', [['Campaign name', R], ['Advertiser', R], ['Category', R], ['KPI type', R], ['Paid on', R], ['Model', R], ['Advertiser pays', R], ['Publisher payout', R], ['Geo', O], ['Device', O], ['Daily cap', O], ['Start date', O], ['POC', O]], [['Android FTD', 'SpinArena', 'iGaming', 'Hard', 'First deposit', 'CPA'], ['Savings account', 'Nova Bank PH', 'Banking', 'Hard', 'Account opened', 'CPR']]],
      ['pub', 'Publishers', 'Bring in your publisher list', 'One row per publisher. Contacts and payment details can be added later.', [['Publisher name', R], ['Account manager', R], ['Payout currency', R], ['Traffic types', O], ['Contact email', O], ['Telegram handle', O], ['Your custom fields', O]], [['ClickHive Media', 'Priya S.', 'USD', 'Display, Push', 'ops@clickhive.example'], ['Orbit Leads', 'Arjun M.', 'USD', 'Social', 'team@orbitleads.example']]],
      ['advs', 'Advertisers', 'Bring in your advertiser list', 'One row per advertiser. Pick their saved format later if they send their own layout.', [['Advertiser name', R], ['Type', R], ['Category', R], ['POC', O], ['Validation day', O], ['Payment terms', O], ['Your custom fields', O]], [['SpinArena', 'Direct brand', 'iGaming', 'Arjun M.', '5', 'Net 30'], ['Adbridge Agency', 'Agency', 'Credit card', 'Karan D.', '10', 'Net 45']]],
      ['pay', 'Payments', 'Money received from advertisers or paid to publishers', 'One row per payment, so settlements can be closed in bulk.', [['Month', R], ['Advertiser or publisher', R], ['Amount', R], ['Currency', R], ['Paid on', R], ['Reference', O], ['Notes', O]], [['Oct 2026', 'SpinArena', '15,570.00', 'USD', '2026-11-12', 'WIRE-88123'], ['Oct 2026', 'ClickHive Media', '4,280.00', 'USD', '2026-11-15', 'PAY-2207']]]
    ];
    const cur = T.find((t) => t[0] === tp);
    const on = 'display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border:1px solid #0C0E14;box-shadow:inset 0 0 0 1px #0C0E14;border-radius:12px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer;text-align:left';
    const off = 'display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border:1px solid #E6E6E1;border-radius:12px;background:#FFFFFF;font:14px Geist,system-ui,sans-serif;color:#14161C;cursor:pointer;text-align:left';
    const tpls = T.map(([id, name, when, , cols]) => ({ name, when, cols: cols.length, sel: String(id === tp), style: id === tp ? on : off, pick: () => this.setState({ tp: id }) }));
    const tpl = {
      name: cur[1], about: cur[3],
      chips: cur[4].map(([name, need]) => ({ name, need, style: 'display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;' + (need === R ? 'background:#D4F25A;color:#0C0E14' : 'background:#F0F0EC;color:#4A4D57') })),
      head: cur[4].slice(0, 6).map((c) => c[0]), rows: cur[5]
    };
    const sheets = [['Read me', 'How to fill it in']].concat(T.map((t) => [t[1]])).concat([['Codes', 'their code → our publisher']]).map((x, i) => ({ n: String(i + 1).padStart(2, '0'), name: x[0] }));
    const tabs = [['upload', 'Upload a file', ''], ['templates', 'Templates', String(T.length + 1)], ['formats', 'Saved formats', String(formats.length)]].map(([id, label, count]) => ({ label, count, sel: String(id === tab), pick: () => this.setState({ tab: id }) }));
    const base = 'display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 8px;border-radius:999px;font-size:14px;';
    const steps = [['Choose file', 'done'], ['Match columns', 'now'], ['Check rows', 'next'], ['Compare', 'next'], ['Import', 'next']].map(([label, st], i) => ({
      label,
      mark: st === 'done' ? '✓' : String(i + 1),
      style: base + (st === 'now' ? 'background:#0C0E14;color:#FFFFFF;font-weight:600' : st === 'done' ? 'background:#FFFFFF;border:1px solid #E6E6E1;color:#14161C' : 'background:transparent;border:1px dashed #C9C9C2;color:#5C5F6A'),
      dot: 'width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;' + (st === 'now' ? 'background:#D4F25A;color:#0C0E14' : st === 'done' ? 'background:#0C0E14;color:#D4F25A' : 'background:#ECECE7;color:#4A4D57')
    }));
    const ok = 'color:#1F6B37;font-size:13px;font-weight:600', warn = 'color:#9A4A00;font-size:13px;font-weight:600;background:#FFF1DF;padding:3px 8px;border-radius:6px', skip = 'color:#5C5F6A;font-size:13px';
    const cols = [
      ['date', '20261001, 20261002', 'Date (YYYYMMDD)', '✓ Matched', ok],
      ['campaign', 'sp_cpa, sp_cpa_ios', 'Campaign (their code)', '✓ 3 of 3 found', ok],
      ['partner_code', 'clickhive, adnest_ph', 'Publisher (their code)', '2 codes to match', warn],
      ['media_source', 'ch_main, an_ph_07', 'Traffic source', '✓ Matched', ok],
      ['event_type', 'FD, FD, FD', 'Conversion type', '✓ Only FD counted', ok],
      ['user_id', '1786003489-67850', 'Conversion ID (finds duplicates)', '✓ Matched', ok],
      ['first_deposit_amt', '20, 100, 500', 'Custom field: First deposit amount', '✓ Matched', ok],
      ['net_revenue', '19.5, -3.6, 599.8', 'Custom field: Player revenue', '✓ Matched', ok],
      ['source_flag', 'inapp, blocked', 'Rule: leave out blocked', '✓ 4 rows left out', ok],
      ['+ 19 more', 'register_date, bet_cnt …', 'Skip this column', 'Not imported', skip]
    ].map(([col, sample, field, okText, okStyle]) => ({ col, sample, field, ok: okText, okStyle, selLabel: 'Field for column ' + col }));
    const chip = { Imported: 'background:#E8F3EA;color:#1F6B37', 'Imported with fixes': 'background:#E7ECFD;color:#2440B0' };
    const hist = [
      ['SpinArena Sep validation.xlsx', 'Advertiser report', '3,912', 'Arjun M.', '3 Oct, 11:40 am', 'Imported'],
      ['Oct-2026 tracker - ops team.xlsx', 'Publisher numbers', '1,062', 'Priya S.', '28 Oct, 6:15 pm', 'Imported with fixes'],
      ['ShieldCare leads Oct.csv', 'Advertiser report', '588', 'Meera R.', '1 Nov, 9:02 am', 'Imported'],
      ['History 2023-2025.xlsx', 'Past data (history)', '48,930', 'Priya S.', '14 Oct', 'Imported with fixes']
    ].map(([file, type, rows, by, when, result]) => ({ file, type, rows, by, when, result, chip: chip[result] }));
    return { steps, cols, hist, tabs, isUpload: tab === 'upload', isTemplates: tab === 'templates', isFormats: tab === 'formats', tpls, tpl, sheets, formats, codes };
  }
}
</script>
</body>
</html>
